<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Bekræft e-mail · Oversized Bench</title>
  <link rel="stylesheet" href="/verify.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Oversized Bench</p>
    <h1>Knyt din rekord til din e-mail</h1>
    <p id="text">Tryk på knappen for at bekræfte. Denne browser bliver knyttet til din e-mail og genkender dig fremover. Har du allerede en profil med samme e-mail, hentes din rekord herind.</p>
    <button id="go" type="button">Bekræft</button>
    <p id="msg" role="status"></p>
    <a id="back" href="%%RETURN_URL%%" hidden>Tilbage til spillet</a>
  </main>
  <script src="/verify.js" defer></script>
</body>
</html>
