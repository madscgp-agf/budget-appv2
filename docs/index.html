<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1211" media="(prefers-color-scheme: dark)">
<meta name="description" content="Madplan, tilbud og budget der bogfører sig selv.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Toget Husholdning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  --ground:#F1F2EE;
  --surface:#FFFFFF;
  --surface-2:#E9EAE5;
  --surface-3:#DFE1DA;
  --line:#DCDED6;
  --ink:#15181A;
  --ink-2:#5C6266;
  --ink-3:#878D91;
  --brand:#0E9B6C;
  --brand-deep:#0A7A55;
  --brand-tint:#D6EFE3;
  --brand-ink:#0A6B4B;
  --violet:#5B4FD6;
  --violet-tint:#E2E0FA;
  --danger:#C8372B;
  --danger-tint:#F7E0DD;
  --warn:#B4631A;
  --warn-tint:#F8E8D6;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
  --shadow:0 1px 2px rgba(20,28,24,.05), 0 10px 26px -14px rgba(20,28,24,.22);
  --font-d:"Outfit","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-b:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1211;
    --surface:#171C1A;
    --surface-2:#1F2523;
    --surface-3:#28302D;
    --line:#2C3431;
    --ink:#E9EDEA;
    --ink-2:#9AA3A0;
    --ink-3:#767F7C;
    --brand:#37C795;
    --brand-deep:#5BD9AC;
    --brand-tint:#12312A;
    --brand-ink:#6FE0B8;
    --violet:#8B82F0;
    --violet-tint:#221F45;
    --danger:#F0857A;
    --danger-tint:#37201D;
    --warn:#E0A264;
    --warn-tint:#33261A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1211;
  --surface:#171C1A;
  --surface-2:#1F2523;
  --surface-3:#28302D;
  --line:#2C3431;
  --ink:#E9EDEA;
  --ink-2:#9AA3A0;
  --ink-3:#767F7C;
  --brand:#37C795;
  --brand-deep:#5BD9AC;
  --brand-tint:#12312A;
  --brand-ink:#6FE0B8;
  --violet:#8B82F0;
  --violet-tint:#221F45;
  --danger:#F0857A;
  --danger-tint:#37201D;
  --warn:#E0A264;
  --warn-tint:#33261A;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 28px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100%;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-b);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.45;
  /* Behave like an app on a touch screen, not like a document. */
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
}
/* Chrome is not selectable; the numbers and names still are. */
.hdr,.tabbar,.tab,.chip,.btn,.tag,.sec-label,.day-date,.cb,.sw{user-select:none;-webkit-user-select:none}
h1,h2,h3,h4{margin:0;font-family:var(--font-d);font-weight:600;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{
  max-width:460px;margin:0 auto;background:var(--ground);position:relative;
  min-height:100vh;min-height:100dvh;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
@media(min-width:520px){ .app{box-shadow:0 0 0 1px var(--line)} }

/* ---------- header ---------- */
.hdr{
  position:sticky;top:0;z-index:30;
  padding:calc(20px + env(safe-area-inset-top)) 20px 12px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  background:var(--ground);
}
.hdr::after{
  content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;pointer-events:none;
  background:linear-gradient(var(--ground),transparent);
}
.hdr h1{font-size:27px}
.hdr .sub{color:var(--ink-3);font-size:13.5px;margin-top:3px}
.badge-live{
  background:var(--brand-tint);color:var(--brand-ink);
  font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.badge-live i{width:6px;height:6px;border-radius:50%;background:var(--brand);display:block;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hdr-note{color:var(--ink-3);font-size:13px;text-align:right}
.hdr-gear{
  display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:14px;padding:8px 10px 6px;min-width:52px;min-height:52px;cursor:pointer;
  font-size:10.5px;font-weight:600;font-family:var(--font-b);
  transition:background .15s,border-color .15s,transform .08s;
}
.hdr-gear:active{transform:scale(.94)}
.hdr-gear:hover{background:var(--surface-2);color:var(--ink)}
.hdr-gear:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- layout ---------- */
.view{padding:0 20px 10px;display:flex;flex-direction:column;gap:14px;animation:viewIn .2s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.sec-label{font-size:13px;color:var(--ink-3);padding:10px 4px 0;font-weight:500}

.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.card-flat{background:var(--surface-2);border-radius:var(--r-lg);padding:16px}
.card-tint{background:var(--brand-tint);border-radius:var(--r-lg);padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h3{font-size:15.5px}

.stat-l{font-size:13px;color:var(--ink-2)}
.stat-v{font-size:26px;font-weight:600;margin-top:5px}
.stat-s{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.pos{color:var(--brand-deep)}
.neg{color:var(--danger)}

/* ---------- home ---------- */
.hero{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:20px}
.ring{position:relative;width:132px;height:132px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .rv{position:relative;text-align:center}
.ring .rv b{display:block;font-family:var(--font-d);font-size:21px;font-weight:600;letter-spacing:-.03em}
.ring .rv span{font-size:11.5px;color:var(--ink-3)}
.hero-lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero-lines .hl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.hero-lines .hl span{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-lines .hl b{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;flex:none}
.hero-title{font-size:13px;color:var(--ink-3);margin-bottom:2px}

.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .45s cubic-bezier(.22,1,.36,1)}
.bar.violet>i{background:var(--violet)}
.bar.over>i{background:var(--danger)}
.bar.warn>i{background:var(--warn)}

/* automation feed */
.feed{display:flex;flex-direction:column;gap:0}
.feed-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:0;padding-bottom:0}
.feed-item:first-child{padding-top:0}
.feed-ic{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--brand-tint);color:var(--brand-ink)}
.feed-ic.v{background:var(--violet-tint);color:var(--violet)}
.feed-ic.d{background:var(--danger-tint);color:var(--danger)}
.feed-tx{flex:1;min-width:0}
.feed-tx b{font-weight:500;font-size:14px;display:block}
.feed-tx span{font-size:12.5px;color:var(--ink-3)}
.feed-amt{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;white-space:nowrap}

/* toggles */
.tog-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tog-row:last-child{border-bottom:0;padding-bottom:0}
.tog-row .tt{flex:1;min-width:0}
.tog-row .tt b{display:block;font-size:14px;font-weight:500}
.tog-row .tt span{font-size:12.5px;color:var(--ink-3)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--surface-3);border-radius:999px;transition:background .18s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.sw input:checked + i{background:var(--brand)}
.sw input:checked + i::after{transform:translateX(18px)}
.sw input:focus-visible + i{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- budget ---------- */
.cat{display:flex;flex-direction:column;gap:7px;padding:11px 0}
.cat-top{display:flex;align-items:center;gap:10px}
.cat-top .ci{width:24px;height:24px;flex:none;display:grid;place-items:center;color:var(--ink-2)}
.cat-top .cn{flex:1;font-size:14.5px;font-weight:500}
.cat-top .cv{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--ink-2)}
.line-item{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:var(--r-md);padding:13px 15px}
.line-item .li-ic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--ink-2)}
.line-item .li-n{flex:1;font-size:14.5px}
.line-item .li-v{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:500;font-size:14.5px}

.exp{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp .ei{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.exp .ei.auto{background:var(--brand-tint);color:var(--brand-ink)}
.exp .et{flex:1;min-width:0}
.exp .et b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .et span{font-size:12.5px;color:var(--ink-3)}
.exp .ev{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:500}

/* ---------- chips / buttons ---------- */
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{
  border:1.5px solid var(--brand);background:transparent;color:var(--brand-ink);
  border-radius:999px;padding:11px 19px;min-height:46px;font-size:14.5px;font-weight:500;cursor:pointer;
  transition:background .15s,color .15s,transform .08s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:12px 16px;min-height:48px;font-size:14.5px;font-weight:500;cursor:pointer;
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn-brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-brand:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn-lg{padding:13px 20px;font-size:15px;border-radius:13px}
.btn-block{width:100%}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;color:var(--ink-3);padding:11px;border-radius:11px;cursor:pointer;display:grid;place-items:center;min-width:44px;min-height:44px}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

.tag{display:inline-flex;align-items:center;gap:5px;background:var(--brand-tint);color:var(--brand-ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.tag.grey{background:var(--surface-2);color:var(--ink-2)}
.tag.done{background:var(--brand);color:#fff}

/* ---------- meal plan ---------- */
.day{background:var(--surface-2);border-radius:var(--r-lg);overflow:hidden;transition:background .2s}
.day.done{background:var(--brand-tint)}
.day-top{display:flex;align-items:center;gap:13px;padding:15px 16px;min-height:66px;cursor:pointer;transition:transform .08s}
.day-top:active{transform:scale(.99)}
.day-date{width:34px;flex:none;text-align:center}
.day-date span{display:block;font-size:11px;color:var(--ink-3);text-transform:capitalize}
.day-date b{display:block;font-family:var(--font-d);font-size:17px;font-weight:600;line-height:1.15}
.day-name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-name>b{font-size:15.5px;font-weight:500;font-family:var(--font-b)}
.day.done .day-name>b{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.65}
.day-cost{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:500;white-space:nowrap}
.day-body{padding:0 16px 16px;display:none;flex-direction:column;gap:12px}
.day.open .day-body{display:flex}
.ing{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .in{flex:1}
.ing .iv{font-family:var(--font-d);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ing .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--surface-3)}
.ing .dot.have{background:var(--brand)}

/* ---------- shopping list ---------- */
.item{
  display:flex;align-items:center;gap:13px;background:var(--surface-2);border-radius:var(--r-md);
  padding:15px;min-height:66px;cursor:pointer;
  transition:opacity .2s,background .2s,transform .08s;
}
.item:active{transform:scale(.985);background:var(--surface-3)}
.item.bought{opacity:.5}
.cb{width:27px;height:27px;flex:none;position:relative}
.cb input{position:absolute;inset:-11px;opacity:0;width:calc(100% + 22px);height:calc(100% + 22px);margin:0;cursor:pointer;z-index:2}
.cb i{position:absolute;inset:0;border:2px solid var(--ink-3);border-radius:7px;transition:background .15s,border-color .15s;display:grid;place-items:center}
.cb i svg{opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s;color:#fff}
.cb input:checked + i{background:var(--brand);border-color:var(--brand)}
.cb input:checked + i svg{opacity:1;transform:scale(1)}
.cb input:focus-visible + i{outline:2px solid var(--brand);outline-offset:2px}
.item-t{flex:1;min-width:0}
.item-t .n{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-t .n b{font-size:15px;font-weight:500}
.item.bought .item-t .n b{text-decoration:line-through}
.item-t .m{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item-p{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:500;white-space:nowrap}

/* ---------- offers ---------- */
.offer{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:var(--r-md);padding:14px 15px}
.offer .ot{flex:1;min-width:0}
.offer .ot b{font-size:15px;font-weight:500;display:block}
.offer .ot span{font-size:12.5px;color:var(--ink-3)}
.offer .op{text-align:right}
.offer .op b{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;display:block}
.offer .op .was{font-size:12px;color:var(--ink-3);text-decoration:line-through}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  max-width:460px;margin:0 auto;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;border:0;background:none;cursor:pointer;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;min-height:54px;
  font-size:10.5px;font-weight:500;font-family:var(--font-b);
  border-radius:12px;transition:color .15s,transform .08s;
}
.tab:active{transform:scale(.93)}
.tab[aria-current="page"]{color:var(--brand-deep)}
.tab:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.tab .tn{position:relative}
.tab .dot{position:absolute;top:-2px;right:-6px;min-width:15px;height:15px;border-radius:999px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--font-d)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:26px 14px;color:var(--ink-3);font-size:13.5px}
.foot-note{display:flex;gap:9px;align-items:flex-start;color:var(--ink-3);font-size:12.5px;padding:2px 4px}
.foot-note svg{flex:none;margin-top:1px}
.toast-wrap{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 20px}
.toast{
  background:var(--ink);color:var(--ground);border-radius:12px;padding:11px 16px;font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.45);max-width:420px;
  display:flex;align-items:center;gap:10px;pointer-events:auto;
  animation:rise .2s cubic-bezier(.22,1,.36,1);
}
.toast button{border:0;background:none;color:var(--brand);font-weight:600;font-size:13.5px;cursor:pointer;padding:0 0 0 4px;white-space:nowrap}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,14,12,.5);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .16s ease}
@keyframes fadeIn{from{opacity:0}}
.sheet{
  width:100%;max-width:460px;background:var(--surface);
  border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;animation:sheetUp .26s cubic-bezier(.22,1,.36,1);
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.opskrift{display:block}
.opskrift ol{margin:0;padding-left:20px}
.opskrift li{margin-bottom:11px;padding-left:6px}
.opskrift li span{font-size:14.5px;line-height:1.5}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet .grip{width:38px;height:4px;border-radius:999px;background:var(--surface-3);margin:-8px auto 2px}
.sheet h3{font-size:18px}
.sheet p{color:var(--ink-2);font-size:14.5px}
.sheet .acts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
@media (prefers-reduced-motion: reduce){

<script>
/* Skemaet lagt ind i appen, så det kan kopieres direkte fra telefonen. */
const SKEMA_SQL = "-- ============================================================\n--  Toget — deling mellem to personer\n--  Kør i Supabase: SQL Editor -> New query -> indsæt -> Run.\n--  Kan køres igen uden at ødelægge data.\n--\n--  Husstanden gemmes som ét dokument. Appen har i forvejen én\n--  samlet tilstand, og to personer redigerer sjældent det samme\n--  sekund; klienten fletter pr. post og prøver igen ved sammenstød.\n-- ============================================================\n\ncreate extension if not exists pgcrypto;\n\ncreate table if not exists husstande (\n  id        uuid primary key default gen_random_uuid(),\n  navn      text not null default 'Vores husstand',\n  kode      text not null unique,                 -- invitationskode, fx \"GROEN-HAVRE-42\"\n  doc       jsonb not null default '{}'::jsonb,   -- madplan, indkøbsliste, udgifter, opsætning\n  version   bigint not null default 1,\n  opdateret timestamptz not null default now(),\n  oprettet  timestamptz not null default now()\n);\n\ncreate table if not exists medlemmer (\n  husstand_id uuid not null references husstande(id) on delete cascade,\n  bruger_id   uuid not null references auth.users(id) on delete cascade,\n  navn        text not null default 'Mig',\n  rolle       text not null default 'medlem' check (rolle in ('ejer','medlem')),\n  tilmeldt    timestamptz not null default now(),\n  primary key (husstand_id, bruger_id)\n);\ncreate index if not exists idx_medlemmer_bruger on medlemmer(bruger_id);\n\n-- To personer pr. husstand. Det er en parapp, ikke et regnskabssystem.\ncreate or replace function tjek_to_medlemmer() returns trigger\nlanguage plpgsql security definer as $$\nbegin\n  if (select count(*) from medlemmer where husstand_id = new.husstand_id) >= 2 then\n    raise exception 'Der kan kun være to personer i en husstand';\n  end if;\n  return new;\nend $$;\n\ndrop trigger if exists medlemmer_maks_to on medlemmer;\ncreate trigger medlemmer_maks_to before insert on medlemmer\n  for each row execute function tjek_to_medlemmer();\n\n-- ============================================================\n--  Row Level Security: man ser kun sin egen husstand\n-- ============================================================\nalter table husstande enable row level security;\nalter table medlemmer enable row level security;\n\n-- Uden security definer ville politikken på medlemmer slå sig selv op i en løkke.\ncreate or replace function mine_husstande() returns setof uuid\nlanguage sql security definer stable as $$\n  select husstand_id from medlemmer where bruger_id = auth.uid()\n$$;\n\ndrop policy if exists husstand_laes on husstande;\ncreate policy husstand_laes on husstande for select\n  using (id in (select mine_husstande()));\n\n-- Man må oprette en husstand; man bliver først medlem i næste kald.\ndrop policy if exists husstand_opret on husstande;\ncreate policy husstand_opret on husstande for insert\n  to authenticated with check (true);\n\ndrop policy if exists husstand_ret on husstande;\ncreate policy husstand_ret on husstande for update\n  using (id in (select mine_husstande()))\n  with check (id in (select mine_husstande()));\n\ndrop policy if exists medlem_laes on medlemmer;\ncreate policy medlem_laes on medlemmer for select\n  using (husstand_id in (select mine_husstande()) or bruger_id = auth.uid());\n\ndrop policy if exists medlem_tilmeld on medlemmer;\ncreate policy medlem_tilmeld on medlemmer for insert\n  with check (bruger_id = auth.uid());\n\ndrop policy if exists medlem_ret on medlemmer;\ncreate policy medlem_ret on medlemmer for update using (bruger_id = auth.uid());\n\ndrop policy if exists medlem_forlad on medlemmer;\ncreate policy medlem_forlad on medlemmer for delete using (bruger_id = auth.uid());\n\n-- ============================================================\n--  Slå en invitationskode op uden at kunne læse husstandens data\n-- ============================================================\ncreate or replace function find_husstand(p_kode text)\nreturns table (id uuid, navn text, antal int)\nlanguage sql security definer stable as $$\n  select h.id, h.navn, (select count(*)::int from medlemmer m where m.husstand_id = h.id)\n  from husstande h\n  where upper(h.kode) = upper(trim(p_kode))\n$$;\n\nrevoke all on function find_husstand(text) from public, anon;\ngrant execute on function find_husstand(text) to authenticated;\n\n-- Gem-tidspunkt sættes af databasen, ikke af telefonens ur.\ncreate or replace function saet_opdateret() returns trigger\nlanguage plpgsql as $$\nbegin\n  new.opdateret = now();\n  return new;\nend $$;\n\ndrop trigger if exists husstande_opdateret on husstande;\ncreate trigger husstande_opdateret before update on husstande\n  for each row execute function saet_opdateret();\n";

<script>
/* ============================================================
   Sky — deling mellem to telefoner via Supabase.
   Rå fetch, ingen biblioteker: appen skal kunne ligge som én fil
   og stadig virke uden net.
   ============================================================ */
const Sky = (function(){
  const NØGLE_CFG = 'toget.sky.cfg';
  const NØGLE_SES = 'toget.sky.session';
  const NØGLE_HUS = 'toget.sky.husstand';

  let cfg = null, session = null, husstandId = null;
  let lytter = null, timer = null, sidsteVersion = 0;

  const læs = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } };
  const skriv = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

  /* Er projektet lagt ind på forhånd, skal ingen taste nøgler på en telefon. */
  const FORUD = {
    url: 'https://kbpxfrgxgrzmrdvldbbu.supabase.co',
    key: 'sb_publishable_oZp2KKJqaMmTOguerlsCmw_Wb4eP91p'
  };
  cfg = læs(NØGLE_CFG);
  if (!cfg && FORUD.url && FORUD.key){ cfg = {url: FORUD.url, key: FORUD.key}; skriv(NØGLE_CFG, cfg); }
  session = læs(NØGLE_SES);
  husstandId = læs(NØGLE_HUS);

  const opsat = () => !!(cfg && cfg.url && cfg.key);
  const loggetInd = () => !!(session && session.access_token);

  function fejlTekst(data, res){
    const m = (data && (data.error_description || data.msg || data.message || data.error)) || '';
    if (/Invalid login credentials/i.test(m)) return 'Forkert mail eller adgangskode';
    if (/Email not confirmed/i.test(m)) return 'Bekræft din mail først — tjek indbakken';
    if (/User already registered/i.test(m)) return 'Der findes allerede en bruger med den mail — log ind i stedet';
    if (/Password should be/i.test(m)) return 'Adgangskoden skal være mindst 6 tegn';
    if (/kun være to personer/i.test(m)) return 'Der er allerede to personer i den husstand';
    if (/duplicate key/i.test(m)) return 'Du er allerede med i den husstand';
    if (m) return m;
    return 'Noget gik galt (' + (res ? res.status : '?') + ')';
  }

  async function kald(sti, {metode = 'GET', krop, auth = true, headers = {}} = {}){
    if (!opsat()) throw new Error('Skyen er ikke sat op endnu');
    const h = Object.assign({
      'apikey': cfg.key,
      'content-type': 'application/json'
    }, headers);
    if (auth && session && session.access_token) h['authorization'] = 'Bearer ' + session.access_token;

    const res = await fetch(cfg.url.replace(/\/$/, '') + sti, {
      method: metode,
      headers: h,
      body: krop === undefined ? undefined : JSON.stringify(krop)
    });
    const tekst = await res.text();
    let data = null;
    try { data = tekst ? JSON.parse(tekst) : null; } catch(e){ data = tekst; }
    if (!res.ok){
      // Udløbet token: forny én gang og prøv igen.
      if (res.status === 401 && auth && session && session.refresh_token && !sti.includes('/auth/v1/token')){
        const fornyet = await forny();
        if (fornyet) return kald(sti, {metode, krop, auth, headers});
      }
      const e = new Error(fejlTekst(data, res));
      e.status = res.status;
      throw e;
    }
    return data;
  }

  async function forny(){
    try {
      const data = await kald('/auth/v1/token?grant_type=refresh_token',
        {metode:'POST', krop:{refresh_token: session.refresh_token}, auth:false});
      gemSession(data);
      return true;
    } catch(e){
      gemSession(null);
      return false;
    }
  }

  function gemSession(data){
    session = data && data.access_token ? data : null;
    skriv(NØGLE_SES, session);
  }

  /* ---------------- opsætning og login ---------------- */
  function konfigurer(url, key){
    if (!/^https:\/\/.+\.supabase\.co\/?$/.test(url.trim()))
      throw new Error('URL\'en skal se ud som https://xxxx.supabase.co');
    if (!key.trim() || key.trim().length < 30) throw new Error('Nøglen ser ikke rigtig ud');
    cfg = {url: url.trim().replace(/\/$/, ''), key: key.trim()};
    skriv(NØGLE_CFG, cfg);
  }

  async function opret(email, kode){
    const data = await kald('/auth/v1/signup', {metode:'POST', krop:{email, password: kode}, auth:false});
    if (data && data.access_token) gemSession(data);
    // Uden access_token kræver projektet mailbekræftelse.
    return {bekræftKrævet: !(data && data.access_token)};
  }

  async function login(email, kode){
    const data = await kald('/auth/v1/token?grant_type=password',
      {metode:'POST', krop:{email, password: kode}, auth:false});
    gemSession(data);
    return data;
  }

  function logUd(){
    gemSession(null);
    husstandId = null; skriv(NØGLE_HUS, null);
    stopLytning();
  }

  const brugerId = () => (session && session.user && session.user.id) || null;
  const brugerMail = () => (session && session.user && session.user.email) || null;

  /* ---------------- husstand ---------------- */
  const ORD1 = ['GROEN','BLAA','ROED','GUL','HVID','SORT','VARM','KOLD','STOR','LILLE'];
  const ORD2 = ['HAVRE','KANEL','PORRE','SALVIE','TIMIAN','HYLDE','MYNTE','LAKRIDS','ANIS','PEBER'];
  function nyKode(){
    const t = (n) => n[Math.floor(Math.random() * n.length)];
    return t(ORD1) + '-' + t(ORD2) + '-' + (10 + Math.floor(Math.random() * 90));
  }

  async function opretHusstand(navn, mitNavn, doc){
    let sidsteFejl = null;
    for (let forsøg = 0; forsøg < 5; forsøg++){
      const kode = nyKode();
      try {
        const rows = await kald('/rest/v1/husstande', {
          metode:'POST',
          krop:{navn: navn || 'Vores husstand', kode, doc: doc || {}, version: 1},
          headers:{'prefer':'return=representation'}
        });
        const h = rows[0];
        await kald('/rest/v1/medlemmer', {
          metode:'POST',
          krop:{husstand_id: h.id, bruger_id: brugerId(), navn: mitNavn || 'Mig', rolle:'ejer'},
          headers:{'prefer':'return=representation'}
        });
        husstandId = h.id; skriv(NØGLE_HUS, husstandId);
        sidsteVersion = h.version;
        return h;
      } catch(e){
        sidsteFejl = e;
        if (!/duplicate key|kode/i.test(e.message)) throw e;   // kun kodesammenstød prøves igen
      }
    }
    throw sidsteFejl || new Error('Kunne ikke oprette husstanden');
  }

  async function tilslut(kode, mitNavn){
    const fundet = await kald('/rest/v1/rpc/find_husstand', {metode:'POST', krop:{p_kode: kode}});
    const h = Array.isArray(fundet) ? fundet[0] : fundet;
    if (!h) throw new Error('Den kode findes ikke');
    if (h.antal >= 2) throw new Error('Der er allerede to personer i den husstand');
    await kald('/rest/v1/medlemmer', {
      metode:'POST',
      krop:{husstand_id: h.id, bruger_id: brugerId(), navn: mitNavn || 'Mig', rolle:'medlem'},
      headers:{'prefer':'return=representation'}
    });
    husstandId = h.id; skriv(NØGLE_HUS, husstandId);
    return h;
  }

  async function minHusstand(){
    const rows = await kald('/rest/v1/medlemmer?select=husstand_id,navn,rolle&bruger_id=eq.' + brugerId());
    if (!rows || !rows.length) return null;
    husstandId = rows[0].husstand_id; skriv(NØGLE_HUS, husstandId);
    return husstandId;
  }

  async function medlemmer(){
    if (!husstandId) return [];
    return await kald('/rest/v1/medlemmer?select=bruger_id,navn,rolle&husstand_id=eq.' + husstandId) || [];
  }

  async function saetMitNavn(navn){
    await kald('/rest/v1/medlemmer?husstand_id=eq.' + husstandId + '&bruger_id=eq.' + brugerId(),
      {metode:'PATCH', krop:{navn}});
  }

  async function forlad(){
    await kald('/rest/v1/medlemmer?husstand_id=eq.' + husstandId + '&bruger_id=eq.' + brugerId(), {metode:'DELETE'});
    husstandId = null; skriv(NØGLE_HUS, null);
    stopLytning();
  }

  /* ---------------- dokumentet ---------------- */
  async function hent(){
    if (!husstandId) return null;
    const rows = await kald('/rest/v1/husstande?select=id,navn,kode,doc,version,opdateret&id=eq.' + husstandId);
    if (!rows || !rows.length) return null;
    sidsteVersion = rows[0].version;
    return rows[0];
  }

  /**
   * Gemmer kun hvis ingen andre har gemt i mellemtiden.
   * Er der sket noget, får kalderen den nye udgave og kan flette.
   */
  async function gem(doc, forventetVersion){
    const v = forventetVersion == null ? sidsteVersion : forventetVersion;
    const rows = await kald(
      '/rest/v1/husstande?id=eq.' + husstandId + '&version=eq.' + v,
      {metode:'PATCH', krop:{doc, version: v + 1}, headers:{'prefer':'return=representation'}});
    if (!rows || !rows.length){
      const frisk = await hent();
      return {konflikt:true, frisk};
    }
    sidsteVersion = rows[0].version;
    return {konflikt:false, version: sidsteVersion};
  }

  /* ----------------------------------------------------------------
     Selvtest: kør den fra telefonen, hvor forbindelsen findes.
     Hvert trin svarer på ét spørgsmål, så en fejl peger på årsagen.
     ---------------------------------------------------------------- */
  async function raa(sti, muligheder){
    muligheder = muligheder || {};
    const h = {'apikey': cfg.key, 'content-type': 'application/json'};
    if (muligheder.auth !== false && session && session.access_token) h['authorization'] = 'Bearer ' + session.access_token;
    const res = await fetch(cfg.url.replace(/\/$/, '') + sti, {
      method: muligheder.metode || 'GET', headers: h,
      body: muligheder.krop === undefined ? undefined : JSON.stringify(muligheder.krop)
    });
    let data = null;
    try { data = JSON.parse(await res.text() || 'null'); } catch(e){}
    return {status: res.status, data};
  }

  async function tjek(){
    const ud = [];
    // info = hverken godt eller skidt, fx at man endnu ikke er logget ind
    const tilfoej = (navn, ok, detalje, info) => ud.push({navn, ok, detalje, info: !!info});

    if (!opsat()){ tilfoej('Opsætning', false, 'Der er hverken URL eller nøgle endnu'); return ud; }

    try {
      const h = await raa('/auth/v1/health', {auth:false});
      tilfoej('Projektet svarer', h.status === 200, h.status === 200 ? cfg.url.replace('https://','') : 'status ' + h.status);
    } catch(e){
      tilfoej('Projektet svarer', false, 'Ingen forbindelse — er du på nettet?');
      return ud;
    }

    try {
      const r = await raa('/rest/v1/', {auth:false});
      tilfoej('Nøglen godtages', r.status === 200,
        r.status === 200 ? 'sb_publishable / anon' : (r.status === 401 ? 'Nøglen afvises — er det den rigtige?' : 'status ' + r.status));
    } catch(e){ tilfoej('Nøglen godtages', false, e.message); }

    // Findes tabellerne? PostgREST svarer 404 hvis skemaet ikke er kørt.
    for (const tabel of ['husstande','medlemmer']){
      try {
        const r = await raa('/rest/v1/' + tabel + '?select=id&limit=1', {auth:false});
        const mangler = r.status === 404 || (r.data && /PGRST205|does not exist|find the table/i.test(JSON.stringify(r.data)));
        tilfoej('Tabellen "' + tabel + '"', !mangler,
          mangler ? 'Kør supabase/schema.sql i SQL Editor' : 'på plads');
      } catch(e){ tilfoej('Tabellen "' + tabel + '"', false, e.message); }
    }

    if (!loggetInd()){
      tilfoej('Login', false, 'Ikke logget ind endnu — næste skridt', true);
      return ud;
    }
    tilfoej('Login', true, brugerMail());

    try {
      const r = await raa('/rest/v1/rpc/find_husstand', {metode:'POST', krop:{p_kode:'FINDES-IKKE-00'}});
      tilfoej('Invitationskoder virker', r.status === 200, r.status === 200 ? 'opslag svarer' : 'status ' + r.status);
    } catch(e){ tilfoej('Invitationskoder virker', false, e.message); }

    if (husstandId){
      try {
        const r = await raa('/rest/v1/husstande?select=id,version&id=eq.' + husstandId);
        tilfoej('Din husstand kan hentes', r.status === 200 && r.data && r.data.length, 'version ' + (r.data && r.data[0] ? r.data[0].version : '?'));
      } catch(e){ tilfoej('Din husstand kan hentes', false, e.message); }

      // Sikkerheden: en husstand vi ikke er med i, må ikke kunne læses.
      try {
        const falsk = '00000000-0000-4000-8000-000000000000';
        const r = await raa('/rest/v1/husstande?select=id&id=eq.' + falsk);
        const tomt = r.status === 200 && Array.isArray(r.data) && r.data.length === 0;
        tilfoej('Fremmede holdes ude', tomt, tomt ? 'Row Level Security er aktiv' : 'ADVARSEL: uventet svar (' + r.status + ')');
      } catch(e){ tilfoej('Fremmede holdes ude', false, e.message); }
    } else {
      tilfoej('Husstand', false, 'Du er ikke med i en husstand endnu — næste skridt', true);
    }
    return ud;
  }

  /* ---------------- hold øje med den anden telefon ---------------- */
  function startLytning(kald_tilbage, sekunder){
    stopLytning();
    lytter = kald_tilbage;
    const tjek = async () => {
      if (document.hidden || !husstandId || !loggetInd()) return;
      try {
        const rows = await kald('/rest/v1/husstande?select=version&id=eq.' + husstandId);
        const v = rows && rows[0] ? rows[0].version : 0;
        if (v > sidsteVersion){
          const frisk = await hent();
          if (frisk && lytter) lytter(frisk);
        }
      } catch(e){ /* uden net prøver vi igen næste gang */ }
    };
    timer = setInterval(tjek, (sekunder || 8) * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tjek(); });
    tjek();
  }
  function stopLytning(){ if (timer) clearInterval(timer); timer = null; lytter = null; }

  return {
    opsat, loggetInd, konfigurer, glemOpsætning: () => { skriv(NØGLE_CFG, null); cfg = null; },
    opret, login, logUd, brugerId, brugerMail,
    opretHusstand, tilslut, minHusstand, medlemmer, saetMitNavn, forlad,
    harHusstand: () => !!husstandId, husstandsId: () => husstandId,
    hent, gem, startLytning, stopLytning, tjek,
    get version(){ return sidsteVersion; }
  };
})();

</script>

const KOST = {

  halal:   {navn:'Halal',      kort:'Halal',    forbud:['svin'],                  ic:'moon'},

};
const vareTags = (k) => CATALOG[k].tags || [];
function retPasserKost(retId, kost){
  const forbud = KOST[kost].forbud;
  if (!forbud.length) return true;
  return retById(retId).varer.every(k => vareTags(k).every(t => forbud.indexOf(t) === -1));
}
/** De kostformer en ret i sig selv opfylder — bruges til mærkaterne. */
function retKostMaerker(retId){
  return ['vegansk','vegetar','halal'].filter(k => retPasserKost(retId, k));
}

function bedstePris(k){
  const v = CATALOG[k];
  const mulige = (v.tilbud || []).filter(t => S.butikker[t.b]);
  const bedste = mulige.length ? mulige.reduce((a, c) => c.p < a.p ? c : a) : null;
  // Har du rettet prisen i indkøbslisten, er det den der gælder — også i budgettet.
  const egen = S.priser && S.priser[k] != null ? S.priser[k] : null;
  if (egen != null) return {pris:egen, butik: bedste ? bedste.b : null, tilbud: egen < v.normal, egen:true};
  if (!bedste) return {pris:v.normal, butik:null, tilbud:false, egen:false};
  return {pris:bedste.p, butik:bedste.b, tilbud:true, egen:false};
}
const pris = (k) => bedstePris(k).pris;                    // pris for én pakke

const andelPrRet = (k) => CATALOG[k].andel || 1;

/** Hvor mange pakker skal der købes, når retterne bruger deres andel? */
function pakker(k, antalRetter){
  return Math.max(1, Math.ceil(andelPrRet(k) * (antalRetter || 1) - 0.0001));
}
/** En ret koster kun sin andel af pakkerne — ikke hele posen ris. */
const retPris = (id) => Math.round(retById(id).varer.reduce((s,k) => s + pris(k) * andelPrRet(k), 0));

/** "2 × 140 g" — og en samlet mængde når det giver mening. */
function maengdeTekst(k, antal){
  const e = CATALOG[k].enhed;
  // "400 g" -> 400, og "2x140 g" -> 280
  const m = e.match(/^\s*(?:([\d.,]+)\s*[x×]\s*)?([\d.,]+)\s*(g|kg|ml|l|stk\.)\s*$/i);
  if (!m) return antal <= 1 ? e : antal + ' × ' + e;
  const pakke = (m[1] ? Number(m[1].replace(',', '.')) : 1) * Number(m[2].replace(',', '.'));
  const enhed = m[3].toLowerCase();
  const rund = (t) => Number.isInteger(t) ? t : Math.round(t * 100) / 100;
  if (antal <= 1) return rund(pakke) + ' ' + enhed + (m[1] ? ' (' + e + ')' : '');
  return antal + ' × ' + rund(pakke) + ' ' + enhed + ' = ' + rund(pakke * antal) + ' ' + enhed;
}

function retterTilKost(){ return RETTER.filter(r => retPasserKost(r.id, S ? S.kost : 'alle')); }

/** Bland en liste — Fisher-Yates, så alle rækkefølger er lige sandsynlige. */
function bland(liste){
  const x = liste.slice();
  for (let i = x.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = x[i]; x[i] = x[j]; x[j] = t;
  }
  return x;
}

/**
 * Trækker syv tilfældige retter fra den valgte kostform.
 * Eneste krav: den samme ret må ikke gå igen i ugen.
 */
function nyMadplan(){
  const pulje = bland(retterTilKost());
  const valgte = pulje.slice(0, 7).map(r => r.id);
  // Har man et meget snævert udvalg, må noget gå igen — ellers bliver ugen ikke fuld.
  let i = 0;
  while (valgte.length < 7 && pulje.length){ valgte.push(pulje[i % pulje.length].id); i++; }
  const man = mondayOf(new Date());
  return valgte.map((id, n) => {
    const d = new Date(man); d.setDate(man.getDate() + n);
    return {dato: ymd(d), ret: id, status: 'planlagt'};
  });
}

/** En tilfældig ret der ikke allerede står på ugeplanen. */
function tilfaeldigRet(undtagen){
  const optaget = new Set((undtagen || []).filter(Boolean));
  const fri = retterTilKost().filter(r => !optaget.has(r.id));
  const pulje = fri.length ? fri : retterTilKost();
  if (!pulje.length) return null;
  return pulje[Math.floor(Math.random() * pulje.length)];
}

/* ---------- indkøbsliste ----------
   status: 'skal' | 'koebt' | 'har' (i forvejen) | 'droppet' (køber ikke)  */
function listeFraPlan(plan){
  const brug = new Map();
  plan.forEach(dag => {
    if (dag.status === 'lavet' || dag.status === 'ude' || !dag.ret) return;
    retById(dag.ret).varer.forEach(k => {
      const e = brug.get(k) || {retter:[], gange:0};
      e.gange += 1;                                  // samme ret to gange tæller to gange
      if (e.retter.indexOf(dag.ret) === -1) e.retter.push(dag.ret);
      brug.set(k, e);
    });
  });
  const ud = [];
  brug.forEach((e, k) => ud.push({vare:k, retter:e.retter, gange:e.gange, antal:pakker(k, e.gange), status:'skal'}));
  return sorterListe(ud);
}
function sorterListe(l){
  return l.sort((a,b) =>
    SEKTIONER.indexOf(CATALOG[a.vare].sektion) - SEKTIONER.indexOf(CATALOG[b.vare].sektion)
    || CATALOG[a.vare].navn.localeCompare(CATALOG[b.vare].navn, 'da'));
}
/** Listen følger madplanen, men beslutninger du har taget bliver stående. */
function synkroniserListe(){
  const gamle = new Map(S.liste.map(i => [i.vare, i]));
  const frisk = listeFraPlan(S.plan);
  S.liste = frisk.map(i => {
    const f = gamle.get(i.vare);
    return Object.assign(i, {
      status: f ? f.status : 'skal',
      manuel: f ? !!f.manuel : false,
      // Har du selv rettet antallet, bliver det stående.
      antal: f && f.egetAntal ? f.antal : i.antal,
      egetAntal: f ? !!f.egetAntal : false
    });
  });
  gamle.forEach((f, v) => {
    // Varer du selv har lagt på, og valg du har taget, må ikke forsvinde.
    if ((f.manuel || f.status !== 'skal') && !S.liste.some(i => i.vare === v)) S.liste.push(f);
  });
  S.liste = sorterListe(S.liste);
}

/** Lister hvor hver post har sin egen nøgle — de flettes post for post. */
const LISTER = {
  udgifter:'id', log:'id', overfoersler:'id', opsparinger:'id',
  faste:'id', kategorier:'id', plan:'dato', liste:'vare'
};
const OBJEKTER = ['priser','spisekammer','butikker','auto'];

/**
 * Tre-vejs fletning: base er det vi hentede, mine er vores egne rettelser,
 * fjern er det den anden telefon har gemt i mellemtiden.
 * Har vi selv rørt noget, vinder vores; ellers vinder deres.
 */
function flet(base, mine, fjern){
  base = base || {}; mine = mine || {}; fjern = fjern || {};
  const ud = {};
  const noegler = new Set([].concat(Object.keys(base), Object.keys(mine), Object.keys(fjern)));

  noegler.forEach(n => {
    const b = base[n], m = mine[n], f = fjern[n];

    if (LISTER[n] && (Array.isArray(m) || Array.isArray(f))){
      ud[n] = fletListe(LISTER[n], b || [], m || [], f || []);
      return;
    }
    if (OBJEKTER.indexOf(n) !== -1 && (m || f)){
      ud[n] = fletObjekt(b || {}, m || {}, f || {});
      return;
    }
    const ændretHosOs = JSON.stringify(m) !== JSON.stringify(b);
    ud[n] = ændretHosOs ? m : (n in fjern ? f : m);
  });
  return ud;
}

function fletListe(noegle, base, mine, fjern){
  const kort = (l) => new Map((l || []).map(x => [x[noegle], x]));
  const B = kort(base), M = kort(mine), F = kort(fjern);
  const ud = [];
  const alle = new Set([].concat([...M.keys()], [...F.keys()]));

  alle.forEach(k => {
    const b = B.get(k), m = M.get(k), f = F.get(k);
    if (m && !f) { if (!b) ud.push(m); return; }          // vi tilføjede den — behold. Slettede de den — respektér det.
    if (!m && f) { if (!b) ud.push(f); return; }          // de tilføjede den — tag den med. Slettede vi den — lad den blive væk.
    if (!m || !f) return;
    const viRettede = JSON.stringify(m) !== JSON.stringify(b);
    ud.push(viRettede ? m : f);
  });

  // Behold rækkefølgen fra vores egen liste, og sæt nye poster bagest.
  const orden = new Map((mine || []).map((x, i) => [x[noegle], i]));
  return ud.sort((a, b2) => {
    const ia = orden.has(a[noegle]) ? orden.get(a[noegle]) : 1e6;
    const ib = orden.has(b2[noegle]) ? orden.get(b2[noegle]) : 1e6;
    return ia - ib;
  });
}

function fletObjekt(base, mine, fjern){
  const ud = {};
  const alle = new Set([].concat(Object.keys(mine || {}), Object.keys(fjern || {})));
  alle.forEach(k => {
    const b = base[k], m = mine[k], f = fjern[k];
    const viRettede = JSON.stringify(m) !== JSON.stringify(b);
    if (m === undefined && f !== undefined && b === undefined){ ud[k] = f; return; }
    if (m !== undefined && f === undefined && b === undefined){ ud[k] = m; return; }
    if (m === undefined || f === undefined) return;      // en af os slettede den
    ud[k] = viRettede ? m : f;
  });
  return ud;
}

function migrer(d){

  if (!d.opsparinger){

  }
  (d.liste || []).forEach(i => {
    if (!i.antal) i.antal = pakker(i.vare, (i.retter || []).length || 1);
    if (i.status) return;
    i.status = i.koebt ? 'koebt' : 'skal';
    delete i.koebt;
  });
  (d.plan || []).forEach(p => { if (!p.status) p.status = 'planlagt'; });
  // Gamle udgifter pegede på en kategorinøgle, ikke et id.
  const dagligvare = (d.kategorier.find(k => k.dagligvare) || d.kategorier[0] || {}).id;
  (d.udgifter || []).forEach(u => {
    if (!u.dato) u.dato = ymd(new Date(u.tid || Date.now()));
    if (u.kategori === 'dagligvarer' || !d.kategorier.some(k => k.id === u.kategori)) u.kategori = dagligvare;
  });
  const butikker = {};
  BUTIKKER.forEach(b => { butikker[b] = d.butikker && d.butikker[b] != null ? !!d.butikker[b] : ['Føtex','Lidl','Rema 1000','Netto'].indexOf(b) !== -1; });
  d.butikker = butikker;
}

/* ============================================================
   Kvitteringer — billedet bliver på den telefon der tog det,
   så husstandens fælles dokument ikke fyldes med fotos.
   ============================================================ */
const Billeder = (function(){
  const DB = 'toget-kvitteringer';
  let db = null;
  function aaben(){
    return new Promise((ok, fejl) => {
      if (db) return ok(db);
      if (!('indexedDB' in window)) return fejl(new Error('ingen lagring'));
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('billeder');
      r.onsuccess = () => { db = r.result; ok(db); };
      r.onerror = () => fejl(r.error || new Error('kunne ikke åbne'));
    });
  }
  const kør = (tilstand, fn) => aaben().then(d => new Promise((ok, fejl) => {
    const t = d.transaction('billeder', tilstand);
    const anmodning = fn(t.objectStore('billeder'));
    anmodning.onsuccess = () => ok(anmodning.result);
    anmodning.onerror = () => fejl(anmodning.error);
  }));
  return {
    gem: (id, data) => kør('readwrite', s => s.put(data, id)),
    hent: (id) => kør('readonly', s => s.get(id)),
    slet: (id) => kør('readwrite', s => s.delete(id))
  };
})();

/** Skaler ned før lagring — en kvittering skal kunne læses, ikke printes. */
function skalerBillede(fil, maks){
  return new Promise((ok, fejl) => {
    const læser = new FileReader();
    læser.onerror = () => fejl(new Error('kunne ikke læse billedet'));
    læser.onload = () => {
      const img = new Image();
      img.onerror = () => fejl(new Error('billedet kunne ikke åbnes'));
      img.onload = () => {
        const m = maks || 1100;
        const skala = Math.min(1, m / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * skala);
        c.height = Math.round(img.height * skala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({data: c.toDataURL('image/jpeg', 0.62), bredde: c.width, hoejde: c.height, element: img});
      };
      img.src = læser.result;
    };
    læser.readAsDataURL(fil);
  });
}

/**
 * Nogle browsere kan finde tekst i et billede. Kan de det, gætter vi på
 * totalen og butikken; kan de ikke, skriver man selv beløbet.
 */
async function laesKvittering(img){
  if (!('TextDetector' in window)) return null;
  try {
    const linjer = await new window.TextDetector().detect(img);
    const tekster = linjer.map(l => l.rawValue).filter(Boolean);
    if (!tekster.length) return null;
    const alt = tekster.join('\n');
    let total = null;
    const totalLinje = tekster.find(t => /(total|i alt|at betale|beløb)/i.test(t));
    const tal = (t) => {
      const m = String(t).match(/(\d{1,5})[.,](\d{2})/g) || String(t).match(/\b(\d{1,5})\b/g);
      if (!m) return null;
      return Math.max.apply(null, m.map(x => Number(String(x).replace('.', '').replace(',', '.'))));
    };
    if (totalLinje) total = tal(totalLinje);
    if (!total) total = Math.max.apply(null, tekster.map(t => tal(t) || 0).filter(Boolean).concat([0])) || null;
    const kendteButikker = BUTIKKER.concat(['Netto','Rema','Coop','Fakta','7-Eleven']);
    const butik = kendteButikker.find(b => new RegExp(b.replace(/\s/g, '\\s*'), 'i').test(alt)) || null;
    return {total, butik, linjer: tekster.length};
  } catch(e){ return null; }
}

  if (skyStatus === st) return;

  const n = document.getElementById('sky-status');
  if (n) n.outerHTML = skyMaerkat();
}

function planlaegSkyGem(){
  clearTimeout(skyTimer);
  skyTimer = setTimeout(gemISky, 900);       // saml hurtige tryk til ét kald
}

async function gemISky(){
  if (skyGemmer || typeof Sky === 'undefined' || !Sky.harHusstand() || !Sky.loggetInd()) return;
  skyGemmer = true;
  saetSkyStatus('gemmer');
  try {
    let svar = await Sky.gem(docFraState());
    if (svar.konflikt && svar.frisk){
      // Den anden telefon nåede at gemme først — flet og prøv igen.
      const flettet = flet(skyBase, docFraState(), svar.frisk.doc);
      Object.assign(S, flettet);
      svar = await Sky.gem(docFraState(), svar.frisk.version);
      if (svar.konflikt) throw new Error('kunne ikke gemme');
      tegn();
    }
    skyBase = docFraState();
    saetSkyStatus('synk');
  } catch(e){
    saetSkyStatus('fejl');
  } finally {
    skyGemmer = false;
  }
}

/** Den anden telefon har gemt: flet deres ændringer ind i vores. */
function modtagFraSky(frisk){
  if (!frisk || !frisk.doc) return;
  const mine = docFraState();
  const flettet = flet(skyBase, mine, frisk.doc);
  const ændret = JSON.stringify(flettet) !== JSON.stringify(mine);
  Object.assign(S, flettet);
  skyBase = JSON.parse(JSON.stringify(frisk.doc));
  if (ændret){
    tegn();
    // Havde vi selv noget nyt, skal det også op.
    if (JSON.stringify(flettet) !== JSON.stringify(frisk.doc)) planlaegSkyGem();
  }
  saetSkyStatus('synk');
}

async function startSky(){
  if (typeof Sky === 'undefined' || !Sky.opsat() || !Sky.loggetInd()) return;
  try {
    if (!Sky.harHusstand()) await Sky.minHusstand();
    if (!Sky.harHusstand()) return;
    const frisk = await Sky.hent();
    if (frisk && frisk.doc && Object.keys(frisk.doc).length){
      // Første gang på denne telefon: tag husstandens data, men behold vores
      // egne rettelser hvis vi har arbejdet offline.
      const flettet = skyBase ? flet(skyBase, docFraState(), frisk.doc) : frisk.doc;
      Object.assign(S, flettet);
      skyBase = JSON.parse(JSON.stringify(frisk.doc));
      migrer(S);
    } else {
      skyBase = null;
      await gemISky();       // tom husstand: læg vores data op
    }
    saetSkyStatus('synk');
    Sky.startLytning(modtagFraSky, 8);
    tegn();
  } catch(e){
    saetSkyStatus('fejl');
  }
}

function skyMaerkat(){
  if (typeof Sky === 'undefined') return '<span id="sky-status"></span>';
  if (!Sky.harHusstand() || !Sky.loggetInd()) return '<span id="sky-status"></span>';
  const t = skyStatus === 'gemmer' ? 'gemmer…' : skyStatus === 'fejl' ? 'ingen forbindelse' : 'synkroniseret';
  const cls = skyStatus === 'fejl' ? 'grey' : '';
  return '<span id="sky-status" class="tag '+cls+'">'+icon(skyStatus === 'fejl' ? 'clock' : 'check',12)+t+'</span>';
}

const maanedNavn = (m) => MONTHS[Number(m.split('-')[1]) - 1];

/** Sidste måned kan først gøres op når den er slut — og kun hvis appen var i brug. */

const linjePris = (i) => pris(i.vare) * (i.antal || 1);
const listeSum = () => skalKoebes().reduce((s,i) => s + linjePris(i), 0);
function butikSum(butik){
  return skalKoebes().reduce((s,i) => {
    const n = i.antal || 1;

    return s + (t ? t.p : CATALOG[i.vare].normal) * n;
  }, 0);
}
const valgteButikker = () => BUTIKKER.filter(b => S.butikker[b]);
const planSum = () => S.plan.filter(d => d.ret && d.status !== 'ude').reduce((s,d) => s + retPris(d.ret), 0);

/** Hvem er jeg på denne telefon? Med deling er det Supabase-brugeren. */
function migsId(){
  if (typeof Sky !== 'undefined' && Sky.loggetInd() && Sky.brugerId()){
    const id = Sky.brugerId();
    if (S.personer.some(p => p.id === id)) return id;
  }
  return S.personer[0] ? S.personer[0].id : 'mig';
}
const erPar = () => S.personer.length >= 2;
const personNavn = (id) => { const p = S.personer.find(x => x.id === id); return p ? p.navn : 'Ukendt'; };
const denAnden = () => S.personer.find(p => p.id !== migsId()) || null;

/** Min andel af en udgift, ud fra hvordan den er sat til at blive delt. */
function andel(u, personId){
  const antal = S.personer.length || 1;
  if (!erPar() || u.deling === 'mig') return u.betaler === personId ? u.belob : 0;
  if (u.deling === 'lige') return u.belob / antal;
  if (u.deling === 'beloeb') return u.betaler === personId ? (u.minAndel || 0) : u.belob - (u.minAndel || 0);
  return u.deling === personId ? u.belob : 0;      // deling peger på den der skal betale alt
}

/** Positivt tal = de andre skylder dig. */
function saldo(personId){
  const fra_udgifter = S.udgifter.reduce((sum, u) =>
    sum + ((u.betaler === personId ? u.belob : 0) - andel(u, personId)), 0);
  const fra_afregninger = S.afregninger.reduce((sum, a) =>
    sum + (a.til === personId ? -a.belob : 0) + (a.fra === personId ? a.belob : 0), 0);
  return fra_udgifter + fra_afregninger;
}

function logFør(tekst, belob, slags){
  S.log.unshift({id:uid(), tid:Date.now(), tekst, belob:belob||0, slags:slags||'koeb'});
  if (S.log.length > 40) S.log.length = 40;
}
function bogfoer(vare, belob, antal){
  const n = antal || 1;
  S.udgifter.unshift({
    id:uid(), tid:Date.now(), dato:ymd(new Date()), vare, antal:n,
    tekst: CATALOG[vare].navn + (n > 1 ? ' (' + n + ' stk.)' : ''),
    belob, kategori: dagligvareKat().id,
    butik: bedstePris(vare).butik, kilde:'auto',
    betaler: migsId(), deling: erPar() ? S.delDefault : 'mig'
  });
  S.sparetIalt += Math.max(0, CATALOG[vare].normal * n - belob);
}
function fjernBogfoering(vare){
  const i = S.udgifter.findIndex(u => u.vare === vare && u.kilde === 'auto');
  if (i < 0) return;
  const u = S.udgifter[i];
  S.sparetIalt = Math.max(0, S.sparetIalt - Math.max(0, CATALOG[vare].normal * (u.antal || 1) - u.belob));
  S.udgifter.splice(i, 1);
}

/** Sæt en linje til købt / har den / køber ikke. Kun 'koebt' rammer budgettet. */
function saetStatus(vare, status, stille){
  const linje = S.liste.find(i => i.vare === vare);
  if (!linje || linje.status === status) return;
  const foer = linje.status;
  if (foer === 'koebt'){                       // ryd op efter et tidligere køb
    fjernBogfoering(vare);
    S.spisekammer[vare] = Math.max(0, (S.spisekammer[vare] || 0) - (linje.antal || 1));
  }
  linje.status = status;
  const antal = linje.antal || 1;
  if (status === 'koebt'){
    S.spisekammer[vare] = (S.spisekammer[vare] || 0) + antal;
    if (S.auto.koeb){
      const p = pris(vare) * antal;
      bogfoer(vare, p, antal);
      if (!stille) logFør((antal > 1 ? antal + ' × ' : '') + CATALOG[vare].navn + ' købt'
        + (bedstePris(vare).butik ? ' i ' + bedstePris(vare).butik : ''), p, 'koeb');
    }
  } else if (status === 'har'){
    S.spisekammer[vare] = Math.max(antal, S.spisekammer[vare] || 0);
    if (!stille) logFør(CATALOG[vare].navn + ' — har den i forvejen, intet trukket', 0, 'fri');
  } else if (status === 'droppet'){
    if (!stille) logFør(CATALOG[vare].navn + ' — købes ikke', 0, 'fri');
  }
}

/** Ret markeret som lavet: spisekammeret tømmes, kun det du faktisk mangler bogføres. */
function lavRet(dato){
  const dag = S.plan.find(d => d.dato === dato);
  if (!dag || !dag.ret || dag.status === 'lavet') return null;
  const ret = retById(dag.ret);
  const manglede = [];
  ret.varer.forEach(k => {
    const linje = S.liste.find(i => i.vare === k);
    const brug = andelPrRet(k);
    if ((S.spisekammer[k] || 0) >= brug - 0.0001){
      // Resten af pakken bliver stående — man bruger sjældent en hel pose ris.
      S.spisekammer[k] = Math.round((S.spisekammer[k] - brug) * 1000) / 1000;
      return;
    }
    if (linje && linje.status === 'droppet') return;   // valgt fra: skal aldrig trækkes
    if (!S.auto.madlav) return;
    const antal = linje ? (linje.antal || 1) : pakker(k, 1);
    const p = pris(k) * antal;
    bogfoer(k, p, antal);
    S.spisekammer[k] = Math.max(0, Math.round(((S.spisekammer[k] || 0) + antal - brug) * 1000) / 1000);
    manglede.push(k);
    if (linje) linje.status = 'koebt';
  });
  dag.status = 'lavet';
  const ekstra = manglede.reduce((s,k) => s + pris(k), 0);
  logFør(ret.navn + ' lavet' + (manglede.length ? ' · ' + manglede.length + ' vare' + (manglede.length>1?'r':'') + ' bogført' : ''), ekstra, 'mad');
  return {ret:ret.navn, manglede, ekstra};
}
function fortrydRet(dato){
  const dag = S.plan.find(d => d.dato === dato);
  if (!dag || dag.status !== 'lavet') return;
  dag.status = 'planlagt';
  retById(dag.ret).varer.forEach(k => {
    S.spisekammer[k] = Math.round(((S.spisekammer[k] || 0) + andelPrRet(k)) * 1000) / 1000;
  });
  logFør(retById(dag.ret).navn + ' sat tilbage på madplanen', 0, 'fortryd');
}
function saetRet(dato, retId){
  const dag = S.plan.find(d => d.dato === dato);
  if (!dag) return;
  dag.ret = retId; dag.status = 'planlagt';
  synkroniserListe();
  logFør(retById(retId).navn + ' lagt på ' + dagNavn(dato).toLowerCase(), 0, 'plan');
}
function udeAtSpise(dato){
  const dag = S.plan.find(d => d.dato === dato);
  if (!dag) return;
  dag.status = 'ude';
  synkroniserListe();
  logFør(dagNavn(dato) + ': ude at spise — retten er taget af planen', 0, 'plan');
}
function byttRet(dato){
  const valg = tilfaeldigRet(S.plan.map(d => d.ret));
  if (valg) saetRet(dato, valg.id);
}
function dagNavn(dato){
  const d = new Date(dato + 'T00:00:00');
  return DAYS[(d.getDay()+6)%7] + '. d. ' + d.getDate() + '.';
}

function toast(tekst, fortrydFn){
  const wrap = document.getElementById('toasts');
  while (wrap.children.length >= 2) wrap.firstChild.remove();
  const n = document.createElement('div');
  n.className = 'toast';
  n.innerHTML = '<span>'+esc(tekst)+'</span>';

/** Én bundskuffe til alt: valg, bekræftelser og små formularer. */
function visSheet({titel, under, html, ved, luk}){
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  const harLuk = /data-luk/.test(html);
  scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(titel)+'">'
    + '<div class="grip"></div>'
    + '<div style="display:flex;align-items:flex-start;gap:12px">'
    +   '<h3 style="flex:1;min-width:0">'+esc(titel)+'</h3>'
    +   '<button class="icon-btn" data-luk="1" aria-label="Luk" style="margin:-8px -8px 0 0">'+icon('x',20)+'</button>'
    + '</div>'
    + (under ? '<p>'+esc(under)+'</p>' : '')
    + html
    + (harLuk ? '' : '<button class="btn btn-block" data-luk="1" style="min-height:50px">Luk</button>')
    + '</div>';
  const fjern = () => {
    scrim.remove();
    document.removeEventListener('keydown', scrim.__paaTast || (() => {}));
    if (luk) luk();
  };
  scrim.addEventListener('click', (e) => {
    if (e.target === scrim || e.target.closest('[data-luk]')) return fjern();
    if (ved) ved(e, fjern);
  });
  const paaTast = (ev) => { if (ev.key === 'Escape') fjern(); };
  document.addEventListener('keydown', paaTast);
  const fjernAlt = () => { document.removeEventListener('keydown', paaTast); fjern(); };
  scrim.__luk = fjernAlt;
  document.body.appendChild(scrim);
  setTimeout(() => { const f = scrim.querySelector('input,button:not([data-luk])'); if (f) f.focus(); }, 70);
  return {luk: fjernAlt, node: scrim};
}
const knapRaekke = (ok, farlig) =>

  + '<button class="btn" data-luk="1" style="min-height:52px">Annullér</button></div>';

function bekraeft(titel, tekst, ok, naar, farlig){

  }});
}

    S.log.slice(0, 8).forEach(l => {
      const cls = l.slags === 'mad' ? 'v' : (l.slags === 'fortryd' ? 'd' : '');
      const ic = l.slags === 'mad' ? 'fork' : l.slags === 'fortryd' ? 'undo'
               : l.slags === 'plan' ? 'shuffle' : l.slags === 'uge' ? 'refresh'
               : l.slags === 'fri' ? 'ban' : l.slags === 'opsparing' ? 'pig' : 'basket';
      h += '<div class="feed-item"><div class="feed-ic '+cls+'">'+icon(ic,15)+'</div>'
        +  '<div class="feed-tx"><b>'+esc(l.tekst)+'</b><span>'+tidSiden(l.tid)+'</span></div>'
        +  (l.belob ? '<div class="feed-amt neg">−'+kr(l.belob)+'</div>' : '')
        +  '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function tidSiden(t){
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return 'lige nu';
  if (s < 3600) return Math.round(s/60) + ' min. siden';
  if (s < 86400) return Math.round(s/3600) + ' t. siden';
  return Math.round(s/86400) + ' dage siden';
}

/* ---------------- Tilbud ---------------- */
function tegnTilbud(){
  const paaListen = new Set(S.liste.map(i => i.vare));
  const iPlanen = new Set();
  S.plan.forEach(d => { if (d.ret && d.status !== 'ude') retById(d.ret).varer.forEach(k => iPlanen.add(k)); });

  // Kun tilbud der hverken står på indkøbslisten eller indgår i ugens madplan.
  const andre = Object.keys(CATALOG)
    .filter(k => erTilbud(k) && !paaListen.has(k) && !iPlanen.has(k))
    .sort((a,b) => (CATALOG[b].normal - pris(b)) - (CATALOG[a].normal - pris(a)));

  let h = '';
  h += '<div class="sec-label" style="display:flex;justify-content:space-between;align-items:center">'
    +  '<span>Dine butikker · '+valgteButikker().length+' valgt</span>'
    +  '<button class="btn btn-ghost" style="padding:5px 10px;font-size:13px;min-height:auto" data-gaatil="indstillinger">Rediger</button></div>';
  h += '<div class="chips">';
  BUTIKKER.forEach(b => { h += '<button class="chip" data-butik="'+esc(b)+'" aria-pressed="'+(S.butikker[b]?'true':'false')+'">'+esc(b)+'</button>'; });
  h += '</div>';

  h += '<div class="foot-note">'+icon('bulb',15)
    +  '<span>Alt her er på tilbud og indgår <b>ikke</b> i din madplan. Tryk på en vare for at sætte den på indkøbslisten.</span></div>';

  if (!andre.length){
    h += '<div class="card">'+ '<div class="empty">Ingen tilbud udenfor madplanen lige nu. Vælg flere butikker, så dukker der mere op.</div></div>';
    return h;
  }

  const perSektion = {};
  andre.forEach(k => { (perSektion[CATALOG[k].sektion] = perSektion[CATALOG[k].sektion] || []).push(k); });
  SEKTIONER.forEach(sek => {
    const varer = perSektion[sek];
    if (!varer || !varer.length) return;
    h += '<div class="sec-label">'+sek+'</div><div style="display:flex;flex-direction:column;gap:9px">';
    varer.forEach(k => {
      const v = CATALOG[k], bp = bedstePris(k);
      const spar = Math.max(0, v.normal - bp.pris);
      h += '<div class="item" data-tilfoej="'+k+'">'
        +   '<span class="dot-icon" style="background:var(--brand-tint);color:var(--brand-ink)">'+icon('plus',17)+'</span>'
        +   '<div class="item-t"><div class="n"><b>'+esc(v.navn)+'</b>'
        +     '<span class="tag">'+icon('tag',12)+'tilbud'+(bp.butik ? ' · '+esc(bp.butik) : '')+'</span></div>'
        +     '<div class="m">'+esc(v.enhed)+(spar ? ' · spar '+kr(spar) : '')+'</div></div>'
        +   '<div class="item-p"><span class="pos">'+kr(bp.pris)+'</span>'
        +     '<div style="font-size:12px;color:var(--ink-3);text-decoration:line-through;font-weight:400">'+kr(v.normal)+'</div></div>'
        + '</div>';
    });
    h += '</div>';
  });

  h += '<div class="foot-note">'+icon('clock',15)+'<span>Priser fra ugens aviser. I den rigtige app hentes de fra minetilbud.dk og caches i en time.</span></div>';
  return h;
}

/* ---------------- Madplan ---------------- */
function tegnMadplan(){
  const est = planSum();
  const spist = S.plan.filter(d => d.status === 'lavet').reduce((s,d) => s + retPris(d.ret), 0);
  const ude = S.plan.filter(d => d.status === 'ude').length;
  const k = KOST[S.kost];

  let h = '';
  h += '<div class="card">'
    +   '<div style="display:flex;align-items:center;gap:10px">'
    +     '<div style="min-width:0"><div class="stat-l" style="white-space:nowrap">Ugebudget mad</div>'
    +       '<div class="stat-v" style="font-size:21px;white-space:nowrap">'+kr(UGEBUDGET_MAD)+'</div></div>'
    +     '<div style="min-width:0;flex:1"><div class="stat-l" style="white-space:nowrap">Estimeret</div>'
    +       '<div class="stat-v '+(est>UGEBUDGET_MAD?'neg':'pos')+'" style="font-size:21px;white-space:nowrap">'+kr(est)+'</div></div>'
    +     '<button class="btn btn-brand" data-gen="1" style="padding:11px 15px;border-radius:13px;flex:none">'+icon('refresh',16)+'Ugeforslag</button>'
    +   '</div>'
    +   '<div class="bar'+(est>UGEBUDGET_MAD?' over':'')+'" style="margin-top:14px"><i style="width:'+Math.min(100, Math.round(est/UGEBUDGET_MAD*100))+'%"></i></div>'
    +   '<div style="display:flex;justify-content:space-between;margin-top:7px;font-size:12.5px;color:var(--ink-3)">'
    +     '<span>Spist for '+kr(spist)+(ude?' · '+ude+' dag'+(ude>1?'e':'')+' ude':'')+'</span>'
    +     '<span>'+Math.round(est/UGEBUDGET_MAD*100)+'% af ugebudgettet</span></div>'
    + '</div>';

  /* Kostformen skal være synlig og let at skifte her. */
  h += '<div class="card-flat" style="display:flex;align-items:center;gap:12px">'
    +   '<span style="color:var(--brand-deep)">'+icon(k.ic,20)+'</span>'
    +   '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">Madplanen følger: '+esc(k.navn)+'</div>'
    +     '<div style="font-size:12.5px;color:var(--ink-3)">'+retterTilKost().length+' retter passer til dig</div></div>'
    +   '<button class="btn btn-sm" data-kost="1" style="min-height:40px;padding:9px 14px">Skift</button>'
    + '</div>';

  S.plan.forEach(dag => {
    const d = new Date(dag.dato + 'T00:00:00');
    const wd = DAYS[(d.getDay()+6)%7];
    const gjort = dag.status === 'lavet';
    const erUde = dag.status === 'ude';
    const r = dag.ret ? retById(dag.ret) : null;
    const nTilbud = r ? retTilbud(r.id) : 0;

    h += '<div class="day'+(gjort?' done':'')+(erUde?' ude':'')+'" data-dag="'+dag.dato+'">'
      +   '<div class="day-top">'
      +     '<div class="day-date"><span>'+wd+'</span><b>'+d.getDate()+'</b></div>'
      +     '<div class="day-name"><b>'+(erUde ? 'Ude at spise' : esc(r ? r.navn : 'Ingen ret'))+'</b>'
      +       (!erUde && nTilbud ? '<span class="tag">'+icon('tag',12)+nTilbud+'</span>' : '')
      +       (gjort ? '<span class="tag done">'+icon('check',12)+'lavet</span>' : '')
      +     '</div>'
      +     '<div class="day-cost">'+(erUde ? '—' : kr(r ? retPris(r.id) : 0))+'</div>'
      +     '<button class="icon-btn" data-aabn="'+dag.dato+'" aria-label="Vis muligheder">'+icon('chev',18)+'</button>'
      +   '</div>'
      +   '<div class="day-body">';

    if (!erUde && r){
      h += '<div>';
      r.varer.forEach(vk => {
        const linje = S.liste.find(i => i.vare === vk);
        const har = (S.spisekammer[vk] || 0) > 0 || (linje && (linje.status === 'koebt' || linje.status === 'har'));
        const droppet = linje && linje.status === 'droppet';
        h += '<div class="ing"><span class="dot'+(har?' have':'')+'"></span>'
          +  '<span class="in"'+(droppet?' style="text-decoration:line-through;opacity:.6"':'')+'>'+esc(CATALOG[vk].navn)+'</span>'
          +  '<span class="iv">'+(droppet ? 'købes ikke' : kr(pris(vk))+(erTilbud(vk)?' · tilbud':''))+'</span></div>';
      });
      h += '</div>';
    }

    h += '<div style="display:flex;gap:8px;flex-wrap:wrap">'
      +   (erUde
            ? '<button class="btn btn-block" data-tilbagepaa="'+dag.dato+'">'+icon('undo',16)+'Sæt en ret på igen</button>'
            : gjort
              ? '<button class="btn btn-block" data-fortryd="'+dag.dato+'">'+icon('undo',16)+'Fortryd</button>'
              : '<button class="btn btn-brand" style="flex:1;min-width:150px" data-lavet="'+dag.dato+'">'+icon('check',16)+'Jeg har lavet den</button>')
      +   (!erUde && r ? '<button class="btn" data-opskrift="'+r.id+'" data-dag="'+dag.dato+'" aria-label="Se opskrift">'+icon('book',16)+'</button>' : '')
      +   (!erUde ? '<button class="btn" data-vaelg="'+dag.dato+'" aria-label="Vælg en anden ret">'+icon('search',16)+'</button>' : '')
      +   (!erUde ? '<button class="btn" data-byt="'+dag.dato+'" aria-label="Byt til en anden ret">'+icon('shuffle',16)+'</button>' : '')
      +   (!erUde ? '<button class="btn" data-ude="'+dag.dato+'" aria-label="Ude at spise">'+icon('ude',16)+'</button>' : '')
      + '</div></div></div>';
  });

  const tilbudsvarer = new Set();
  S.plan.forEach(d => { if (d.ret && d.status !== 'ude') retById(d.ret).varer.forEach(k => { if (erTilbud(k)) tilbudsvarer.add(k); }); });
  h += '<div class="foot-note">'+icon('leaf',15)+'<span>Bygget på '+tilbudsvarer.size+' varer på tilbud i dine butikker</span></div>';
  h += '<div class="foot-note">'+icon('cal',15)+'<span>'+ugeTekst()+'</span></div>';
  return h;
}
function ugeTekst(){
  const man = mondayOf(new Date());
  const naeste = new Date(man); naeste.setDate(man.getDate() + 7);
  const dage = Math.ceil((naeste - new Date()) / 86400000);
  return 'Ny uge om '+dage+' dag'+(dage===1?'':'e')+' (mandag d. '+shortDay(naeste)+') — så starter madplanen forfra.';
}

/* ---------------- Retter (vælg selv) ---------------- */
let retSoeg = '';
let retSort = 'tilbud';
let retVis = 40;
function tegnRetter(){
  const paaUgen = S.plan.filter(d => d.ret && d.status !== 'ude').map(d => d.ret);
  let liste = retterTilKost();
  if (retSoeg.trim()){
    const q = retSoeg.trim().toLowerCase();
    liste = liste.filter(r => r.navn.toLowerCase().indexOf(q) !== -1
      || r.varer.some(k => CATALOG[k].navn.toLowerCase().indexOf(q) !== -1));
  }
  liste = liste.slice().sort((a,b) =>
    retSort === 'pris'  ? retPris(a.id) - retPris(b.id)
  : retSort === 'tid'   ? a.tid - b.tid
  : retTilbud(b.id) - retTilbud(a.id) || retPris(a.id) - retPris(b.id));

  let h = '';
  h += '<div class="card-flat" style="display:flex;align-items:center;gap:12px">'
    +   '<span style="color:var(--brand-deep)">'+icon(KOST[S.kost].ic,20)+'</span>'
    +   '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">'+esc(KOST[S.kost].navn)+'</div>'
    +     '<div style="font-size:12.5px;color:var(--ink-3)">Du vælger selv — intet bliver valgt tilfældigt</div></div>'
    +   '<button class="btn btn-sm" data-kost="1" style="min-height:40px;padding:9px 14px">Skift</button></div>';

  h += '<div class="soeg"><span class="ic">'+icon('search',18)+'</span>'
    +  '<input type="text" id="retsoeg" placeholder="Søg ret eller råvare" value="'+esc(retSoeg)+'" autocomplete="off"></div>';

  h += '<div class="seg">'
    +  '<button data-sort="tilbud" aria-pressed="'+(retSort==='tilbud')+'">Flest tilbud</button>'
    +  '<button data-sort="pris" aria-pressed="'+(retSort==='pris')+'">Billigst</button>'
    +  '<button data-sort="tid" aria-pressed="'+(retSort==='tid')+'">Hurtigst</button></div>';

  h += '<button class="btn btn-brand btn-block" data-gen="1">'+icon('refresh',17)+'Lav et ugeforslag til mig</button>';

  h += '<div class="sec-label">'+liste.length+' retter'+(liste.length > retVis ? ' · viser '+retVis : '')+'</div>';
  h += '<div style="display:flex;flex-direction:column;gap:9px">';
  if (!liste.length) h += '<div class="empty">Ingen retter passer til søgningen og din kostform.</div>';
  const vist = liste.slice(0, retVis);
  vist.forEach(r => {
    const paa = paaUgen.indexOf(r.id) !== -1;
    const maerker = retKostMaerker(r.id);
    h += '<div class="ret-kort'+(paa?' paa-ugen':'')+'" data-ret="'+r.id+'">'
      +   '<div class="rt"><b>'+esc(r.navn)+'</b><div class="meta">'
      +     '<span>'+r.tid+' min.</span>'
      +     (retTilbud(r.id) ? '<span class="tag">'+icon('tag',11)+retTilbud(r.id)+' på tilbud</span>' : '')
      +     maerker.map(m => '<span class="kost-maerke v">'+icon(KOST[m].ic,11)+KOST[m].kort+'</span>').join('')
      +     (paa ? '<span class="kost-maerke">på ugen</span>' : '')
      +   '</div></div>'
      +   '<div class="rp">'+kr(retPris(r.id))+'</div>'
      +   '<span class="status-btn">'+icon('chev',18)+'</span>'
      + '</div>';
  });
  h += '</div>';
  if (liste.length > retVis){
    h += '<button class="btn btn-block" data-flere="1" style="margin-top:10px">Vis '
      + Math.min(40, liste.length - retVis) + ' retter mere</button>';
  }
  return h;
}

  const forskel = Math.max(0, enButik - split);
  const fravalgt = S.liste.filter(i => i.status === 'har' || i.status === 'droppet').length;

  let h = '';
  h += '<div class="row">'
    +   '<div class="card-flat"><div class="stat-l" style="text-align:center">Billigst i én butik</div>'
    +     '<div class="stat-v" style="text-align:center;font-size:24px">'+kr(enButik)+'</div>'
    +     '<div class="stat-s" style="text-align:center;color:var(--brand-deep)">'+esc(billigst)+'</div></div>'
    +   '<div class="card-tint"><div class="stat-l" style="text-align:center;color:var(--brand-ink)">Split (billigst pr. vare)</div>'
    +     '<div class="stat-v pos" style="text-align:center;font-size:24px">'+kr(split)+'</div>'
    +     '<div class="stat-s" style="text-align:center;color:var(--brand-ink);opacity:.8">flere butikker</div></div>'
    + '</div>';

  h += '<div class="foot-note" style="padding-top:0">'+icon('bulb',15)
    +  '<span>'+skal.length+' varer at købe'+(fravalgt?' · '+fravalgt+' valgt fra':'')
    +  (forskel > 0 ? ' · spar '+kr(forskel)+' ved at dele på flere butikker' : '')+'</span></div>';

  if (skal.length) h += '<button class="btn btn-brand btn-block" data-alle="1">'+icon('check',17)+'Marker alt som købt ('+kr(split)+')</button>';

  SEKTIONER.forEach(sek => {
    const varer = S.liste.filter(i => CATALOG[i.vare].sektion === sek);
    if (!varer.length) return;
    h += '<div class="sec-label">'+sek+'</div><div style="display:flex;flex-direction:column;gap:9px">';
    varer.forEach(i => {
      const v = CATALOG[i.vare], bp = bedstePris(i.vare);
      const retNavne = i.retter.map(id => retById(id).navn).join(', ');
      const cls = i.status === 'koebt' ? ' bought' : i.status === 'har' ? ' har' : i.status === 'droppet' ? ' droppet' : '';
      const antal = i.antal || 1;
      h += '<div class="item'+cls+'" data-linje="'+i.vare+'">'
        +   '<label class="cb"><input type="checkbox" data-vare="'+i.vare+'"'+(i.status==='koebt'?' checked':'')+'>'
        +     '<i>'+icon('check',14)+'</i><span class="sr">'+esc(v.navn)+'</span></label>'
        +   '<div class="item-t"><div class="n">'
        +     (antal > 1 ? '<span class="antal">'+antal+'×</span>' : '')
        +     '<b>'+esc(v.navn)+'</b>'
        +     (i.status === 'har' ? '<span class="linje-maerke har">har den</span>' : '')
        +     (i.status === 'droppet' ? '<span class="linje-maerke droppet">købes ikke</span>' : '')
        +     (i.status === 'skal' && bp.tilbud && !bp.egen ? '<span class="tag">'+icon('tag',12)+'tilbud'+(bp.butik?' · '+esc(bp.butik):'')+'</span>' : '')
        +     (bp.egen ? '<span class="tag grey">'+icon('pencil',11)+'din pris</span>' : '')
        +     (i.manuel ? '<span class="tag grey">ekstra</span>' : '')+'</div>'
        +     '<div class="m">'+esc(maengdeTekst(i.vare, antal))
        +       (antal > 1 ? ' · ' + kr(pris(i.vare)) + ' stk.' : '')
        +       (retNavne?' · '+esc(retNavne):'')+'</div></div>'
        +   '<div class="item-p">'+(i.status === 'droppet' ? '—' : kr(linjePris(i)))+'</div>'
        +   '<button class="icon-btn status-btn" data-valg="'+i.vare+'" aria-label="Valgmuligheder for '+esc(v.navn)+'">'+icon('chev',17)+'</button>'
        + '</div>';
    });
    h += '</div>';
  });

  if (!S.liste.length) h += '<div class="empty">Listen er tom. Lav et ugeforslag, så fyldes den af sig selv.</div>';
  h += '<div class="foot-note">'+icon('bolt',15)+'<span>Kun varer du krydser af bliver trukket. "Har den" og "købes ikke" rører ikke budgettet.</span></div>';
  return h;
}

      +  '(hjemmeskærmen), hvor den må tale med databasen. Her i forhåndsvisningen er data kun på denne telefon.</div>';

  if (!Sky.opsat()){

      +  '<button class="btn btn-brand btn-block" data-nyhusstand="1">'+icon('house',16)+'Opret husstand</button>'

    const migSelv = p.id === migsId();

      +  '<span style="color:var(--ink-2)">'+icon('users',19)+'</span>'
      +  '<div class="gt"><b>'+esc(p.navn)+(migSelv?' (dig)':'')+'</b>'
      +    '<span>'+(erPar() ? (saldo(p.id) >= 0 ? 'har lagt ud' : 'skylder') + ' ' + kr(Math.abs(saldo(p.id))) : 'alene indtil videre')+'</span></div>'
      +  (migSelv ? '<button class="icon-btn" data-mitnavn="1" aria-label="Ret navn">'+icon('pencil',16)+'</button>' : '')
      +  '</div>';
  });
  h += '</div>';

  if (!erPar()){
    h += '<div class="card-flat" style="margin-bottom:14px">'
      +  '<div class="stat-l">Invitationskode</div>'
      +  '<div class="qr-code-text" style="margin-top:8px" id="hus-kode">henter…</div>'
      +  '<div class="stat-s" style="margin-top:8px">Din partner installerer appen, opretter en bruger og indtaster koden.</div>'
