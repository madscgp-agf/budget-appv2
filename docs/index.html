function felt(navn, id, vaerdi, type){
  return '<div style="margin-bottom:13px"><label for="'+id+'">'+esc(navn)+'</label>'
    + '<input type="'+(type||'text')+'" id="'+id+'" value="'+esc(vaerdi==null?'':vaerdi)+'"'
    + (type === 'number' ? ' inputmode="numeric"' : '') + '></div>';
}
function ikonVaelger(valgt){
  return '<div style="margin-bottom:13px"><label>Ikon</label><div class="chips">'
    + IKONVALG.map(i => '<button type="button" class="icon-btn" data-vaelgikon="'+i+'" aria-pressed="'+(i===valgt)+'" '
      + 'style="border:1.5px solid '+(i===valgt?'var(--brand)':'var(--line)')+';border-radius:11px;color:'+(i===valgt?'var(--brand-ink)':'var(--ink-2)')+'">'
      + icon(i,19)+'</button>').join('')
    + '</div></div>';
}

function redigerPost({titel, navn, belob, ic, gem: gemFn, felter}){
  let valgtIkon = ic || 'basket';
  const html = felt('Navn', 'f-navn', navn)
    + felt(felter === 'maal' ? 'Målbeløb (kr.)' : 'Beløb pr. måned (kr.)', 'f-belob', belob, 'number')
    + (felter === 'maal' ? felt('Sparet indtil nu (kr.)', 'f-sparet', arguments[0].sparet || 0, 'number') : ikonVaelger(valgtIkon))
    + (felter === 'maal' ? '<div class="stat-s" style="margin:-4px 0 14px">Skriv hvad I sparer op til, og hvor meget målet er.</div>' : '')
    + knapRaekke('Gem');
  const sh = visSheet({titel, html, ved:(e, fjern) => {
    const ik = e.target.closest('[data-vaelgikon]');
    if (ik){
      valgtIkon = ik.dataset.vaelgikon;
      sh.node.querySelectorAll('[data-vaelgikon]').forEach(b => {
        const paa = b.dataset.vaelgikon === valgtIkon;
        b.setAttribute('aria-pressed', paa);
        b.style.borderColor = paa ? 'var(--brand)' : 'var(--line)';
        b.style.color = paa ? 'var(--brand-ink)' : 'var(--ink-2)';
      });
      return;
    }
    if (e.target.closest('[data-ok]')){
      const n = sh.node.querySelector('#f-navn').value.trim();
      const b = Math.max(0, Math.round(Number(sh.node.querySelector('#f-belob').value) || 0));
      if (!n) return toast('Giv den et navn');
      const sparetFelt = sh.node.querySelector('#f-sparet');
      fjern();
      gemFn({navn:n, belob:b, ic:valgtIkon, sparet: sparetFelt ? Math.max(0, Math.round(Number(sparetFelt.value) || 0)) : 0});
    }
  }});
}

function vaelgKost(){
  const html = '<div class="sheet-liste">'
    + Object.keys(KOST).map(k => {
        const n = RETTER.filter(r => retPasserKost(r.id, k)).length;
        return '<button class="sheet-valg" data-kostvalg="'+k+'" aria-pressed="'+(S.kost===k)+'">'
          + '<span class="sv-ic">'+icon(KOST[k].ic,19)+'</span>'
          + '<span class="sv-t"><b>'+esc(KOST[k].navn)+'</b><span>'+n+' retter passer</span></span>'
          + (S.kost===k ? '<span class="sv-p">'+icon('check',17)+'</span>' : '') + '</button>';
      }).join('')
    + '</div>';
  visSheet({titel:'Kostform', under:'Madplan og retter tilpasser sig med det samme.', html, ved:(e, fjern) => {
    const b = e.target.closest('[data-kostvalg]');
    if (!b) return;
    const ny = b.dataset.kostvalg;
    fjern();
    if (ny === S.kost) return;
    S.kost = ny;
    // Retter der ikke længere passer skiftes ud, resten får lov at blive.
    let skiftet = 0;
    S.plan.forEach(dag => {
      if (!dag.ret || dag.status === 'lavet' || dag.status === 'ude') return;
      if (retPasserKost(dag.ret, ny)) return;
      const erstat = tilfaeldigRet(S.plan.map(d => d.ret));
      if (erstat){ dag.ret = erstat.id; skiftet++; }
    });
    synkroniserListe();
    logFør('Kostform sat til ' + KOST[ny].navn + (skiftet ? ' · ' + skiftet + ' ret'+(skiftet>1?'ter':')')+' skiftet ud' : ''), 0, 'plan');
    tegn();
    toast(KOST[ny].navn + (skiftet ? ' · ' + skiftet + ' ret'+(skiftet>1?'ter':'')+' skiftet ud' : ''));
  }});
}

  const html = '<div class="sheet-liste">'
    + retterTilKost().slice().sort((a,b) => retTilbud(b.id) - retTilbud(a.id) || retPris(a.id) - retPris(b.id))
        .map(r => '<button class="sheet-valg" data-retvalg="'+r.id+'">'
          + '<span class="sv-ic">'+icon('fork',18)+'</span>'
          + '<span class="sv-t"><b>'+esc(r.navn)+'</b><span>'+r.tid+' min.'+(retTilbud(r.id)?' · '+retTilbud(r.id)+' på tilbud':'')+'</span></span>'
          + '<span class="sv-p">'+kr(retPris(r.id))+'</span></button>').join('')
    + '</div>';
  visSheet({titel:'Vælg ret til ' + dagNavn(dato), under:'Kun retter der passer til ' + KOST[S.kost].navn.toLowerCase() + '.', html, ved:(e, fjern) => {
    const b = e.target.closest('[data-retvalg]');

}

/** Hele opskriften: ingredienser med priser og fremgangsmåde. */
function visOpskrift(retId, muligheder){
  const r = retById(retId), o = muligheder || {};
  const ingr = r.varer.map(k => {
    const linje = S.liste.find(i => i.vare === k);
    const har = (S.spisekammer[k] || 0) >= andelPrRet(k) - 0.0001 || (linje && (linje.status === 'koebt' || linje.status === 'har'));
    const a = andelPrRet(k);
    const brug = a >= 1 ? (a === 1 ? '1 pk.' : a + ' pk.') : Math.round(a * 100) + ' % af ' + CATALOG[k].enhed;
    return '<div class="ing"><span class="dot'+(har?' have':'')+'"></span>'
      + '<span class="in">'+esc(CATALOG[k].navn)+'<br><span style="font-size:12px;color:var(--ink-3)">'+esc(brug)+'</span></span>'

function linjeValg(vare){
  const linje = S.liste.find(i => i.vare === vare);
  if (!linje) return;
  const v = CATALOG[vare], bp = bedstePris(vare);
  const valg = [
    {k:'koebt',   ic:'check', navn:'Købt', txt:'Trækkes fra budgettet: ' + kr(bp.pris)},
    {k:'har',     ic:'box',   navn:'Har den i forvejen', txt:'Bruges i madplanen, men koster ikke noget'},
    {k:'droppet', ic:'ban',   navn:'Købes ikke', txt:'Springes over — rører aldrig budgettet'},
    {k:'skal',    ic:'cart',  navn:'Sæt tilbage på listen', txt:'Skal købes igen'}
  ];
  const html = '<div class="sheet-liste">'
    + valg.map(o => '<button class="sheet-valg" data-linjevalg="'+o.k+'" aria-pressed="'+(linje.status===o.k)+'">'
        + '<span class="sv-ic">'+icon(o.ic,18)+'</span>'
        + '<span class="sv-t"><b>'+o.navn+'</b><span>'+esc(o.txt)+'</span></span>'
        + (linje.status===o.k ? '<span class="sv-p">'+icon('check',17)+'</span>' : '') + '</button>').join('')
    + '<button class="sheet-valg" data-retantal="1"><span class="sv-ic">'+icon('basket',18)+'</span>'
    +   '<span class="sv-t"><b>Ret antal</b><span>'+esc(maengdeTekst(vare, linje.antal || 1))+'</span></span>'
    +   '<span class="sv-p">'+(linje.antal || 1)+'×</span></button>'
    + '<button class="sheet-valg" data-retpris="1"><span class="sv-ic">'+icon('pencil',18)+'</span>'
    +   '<span class="sv-t"><b>Ret prisen</b><span>'+(bp.egen ? 'Din pris: '+kr(bp.pris)+' — tryk for at ændre' : 'Koster den noget andet i butikken?')+'</span></span>'
    +   '<span class="sv-p">'+kr(bp.pris)+'</span></button>'
    + (linje.manuel ? '<button class="sheet-valg" data-fjernlinje="1"><span class="sv-ic">'+icon('trash',18)+'</span>'
        + '<span class="sv-t"><b>Fjern fra listen</b><span>Du har selv lagt den på</span></span></button>' : '')
    + '</div>';
  visSheet({titel:v.navn, under:v.enhed + (bp.butik ? ' · billigst i ' + bp.butik : ''), html, ved:(e, fjern) => {
    if (e.target.closest('[data-retantal]')){ fjern(); return retAntal_sheet(vare); }
    if (e.target.closest('[data-retpris]')){ fjern(); return retPris_sheet(vare); }
    if (e.target.closest('[data-fjernlinje]')){
      fjern();
      if (linje.status === 'koebt') saetStatus(vare, 'skal', true);
      S.liste = S.liste.filter(i => i.vare !== vare);
      tegn(); return toast(v.navn + ' fjernet fra listen');
    }
    const b = e.target.closest('[data-linjevalg]');
    if (!b) return;
    const ny = b.dataset.linjevalg;
    fjern();
    saetStatus(vare, ny);
    bump(8); tegn();
    toast(ny === 'koebt' ? v.navn + ' · ' + kr(bp.pris) + ' trukket'
        : ny === 'har' ? v.navn + ' — har den, intet trukket'
        : ny === 'droppet' ? v.navn + ' — købes ikke'
        : v.navn + ' tilbage på listen',
      () => { saetStatus(vare, linje.status === ny ? 'skal' : linje.status, true); });
  }});
}

/** Flyt det ubrugte forbrugsbudget over i en opsparing. */
function flytForbrug(maaned){
  if (!kanFlytteSidsteMaaned()) return toast('Vent til måneden er gået');
  const rest = restIForbrug(maaned);
  if (rest <= 0) return toast('Der er ikke noget tilovers at flytte');
  if (!S.opsparinger.length) return toast('Opret et opsparingsmål først');
  let maalId = S.aktivOpsparing || S.opsparinger[0].id;

  const linjer = restPrKategori(maaned).filter(r => r.rest > 0)
    .map(r => '<div class="ing"><span class="in">'+esc(r.kat.navn)+'</span><span class="iv">'+kr(r.rest)+'</span></div>').join('');

  const html = '<div style="margin-bottom:14px">' + linjer + '</div>'
    + felt('Hvor meget vil du flytte? (kr.)', 'f-belob', Math.round(rest), 'number')
    + '<label>Over på</label><div class="sheet-liste" style="max-height:30vh;margin-bottom:14px">'
    + S.opsparinger.map(o => '<button class="sheet-valg" data-maal="'+o.id+'" aria-pressed="'+(o.id===maalId)+'">'
        + '<span class="sv-ic">'+icon('pig',18)+'</span>'
        + '<span class="sv-t"><b>'+esc(o.navn)+'</b><span>'+kr(o.sparet)+' af '+kr(o.maal)+'</span></span></button>').join('')
    + '</div>' + knapRaekke('Flyt pengene');

  const sh = visSheet({titel:'Gør '+maanedNavn(maaned)+' op',
    under:'Du brugte '+kr(rest)+' mindre end dine lofter i '+maanedNavn(maaned)+'. Flyt dem over i opsparingen.', html,
    ved:(e, fjern) => {
      const m = e.target.closest('[data-maal]');
      if (m){
        maalId = m.dataset.maal;
        sh.node.querySelectorAll('[data-maal]').forEach(b => b.setAttribute('aria-pressed', b.dataset.maal === maalId));
        return;
      }
      if (!e.target.closest('[data-ok]')) return;
      const v = Math.round(Number(sh.node.querySelector('#f-belob').value) || 0);
      fjern();
      if (v <= 0) return;
      if (v > rest) return toast('Du kan højst flytte ' + kr(rest));
      const o = S.opsparinger.find(x => x.id === maalId);
      o.sparet += v;
      S.overfoersler.push({id:uid(), dato:ymd(new Date()), forMaaned:maaned, belob:v, maal:o.id});
      logFør(kr(v)+' fra '+maanedNavn(maaned)+' flyttet til '+o.navn, 0, 'opsparing');
      tegn();
      toast(kr(v)+' flyttet til '+o.navn);
    }});
}

/**
 * Én skuffe til både "tilføj udgift" og "kvittering".
 * Kategorien vælges her, så en middag ude også kan bogføres.
 */
function udgiftSheet(muligheder2){
  muligheder2 = muligheder2 || {};
  const billede = muligheder2.billede, gaet = muligheder2.gaet;
  const tilbage = muligheder2.tilbage || 0, nr = muligheder2.nr || 1, ialt = muligheder2.ialt || 1;
  if (!S.kategorier.length) return toast('Opret en kategori først');
  let katId = (S.kategorier.find(k => !k.dagligvare) || S.kategorier[0]).id;
  if (gaet && gaet.butik) katId = (dagligvareKat() || {}).id || katId;
  const betaler = migsId();
  let deling = erPar() ? S.delDefault : 'mig';

  const kategoriValg = '<div class="kat-chips">'
    + S.kategorier.map(k => '<button type="button" class="kat-chip" data-kat="'+k.id+'" aria-pressed="'+(k.id===katId)+'">'
        + icon(k.ic,16) + '<span>'+esc(k.navn)+'</span></button>').join('')
    + '</div>';

  const delingValg = !erPar() ? '' :
      '<label>Deling</label><div class="seg" style="margin-bottom:14px">'
    + [['lige','50/50'],['mig','Kun mig']].map(par =>
        '<button type="button" data-del="'+par[0]+'" aria-pressed="'+(deling===par[0])+'">'+par[1]+'</button>').join('')
    + '</div>';

  const html = (billede ? '<img src="'+billede.data+'" alt="Kvittering" style="width:100%;max-height:22vh;object-fit:contain;border-radius:14px;background:var(--surface-2);margin-bottom:14px">' : '')
    + (gaet && gaet.total ? '<div class="stat-s" style="margin:-6px 0 12px;color:var(--brand-ink)">'
        + icon('bolt',13) + ' Læst fra kvitteringen: ' + kr(gaet.total) + (gaet.butik ? ' i ' + esc(gaet.butik) : '') + '</div>' : '')
    + felt('Hvad var det?', 'f-tekst', (gaet && gaet.butik) || (billede ? 'Kvittering' : ''))
    + felt('Beløb (kr.)', 'f-belob', (gaet && gaet.total) || '', 'number')
    + '<label>Kategori</label>' + kategoriValg
    + delingValg
    + felt('Dato', 'f-dato', ymd(new Date()), 'date')
    + knapRaekke('Bogfør');

  const sh = visSheet({
    titel: billede ? (ialt > 1 ? 'Kvittering ' + nr + ' af ' + ialt : 'Kvittering') : 'Ny udgift',
    under: billede
      ? (gaet && gaet.total ? 'Tjek at beløbet passer, og vælg kategori.' : 'Skriv beløbet, og vælg hvilken kategori det hører til.')
      : 'Fx en middag ude, en togbillet eller en biograftur.',
    html: html,
    luk: () => { if (tilbage) setTimeout(naesteKvittering, 300); },
    ved: async (e, fjern) => {
      const k = e.target.closest('[data-kat]');
      if (k){
        katId = k.dataset.kat;
        sh.node.querySelectorAll('[data-kat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.kat === katId));
        return;
      }
      const d = e.target.closest('[data-del]');
      if (d){
        deling = d.dataset.del;
        sh.node.querySelectorAll('[data-del]').forEach(b => b.setAttribute('aria-pressed', b.dataset.del === deling));
        return;
      }
      if (!e.target.closest('[data-ok]')) return;

      const tekst = sh.node.querySelector('#f-tekst').value.trim() || 'Udgift';
      const belob = Math.round((Number(sh.node.querySelector('#f-belob').value) || 0) * 100) / 100;
      const dato = sh.node.querySelector('#f-dato').value || ymd(new Date());
      if (belob <= 0) return toast('Skriv et beløb');

      const id = uid();
      let kvitId = null;
      if (billede){
        kvitId = 'kvit-' + id;
        try { await Billeder.gem(kvitId, billede.data); }
        catch(err){ kvitId = null; toast('Billedet kunne ikke gemmes, men udgiften er bogført'); }
      }
      S.udgifter.unshift({
        id: id, tid: Date.now(), dato: dato, vare: null, tekst: tekst, belob: belob,
        kategori: katId, butik: (gaet && gaet.butik) || null,
        kilde: billede ? 'kvittering' : 'manuel',
        kvittering: kvitId, betaler: betaler, deling: deling
      });
      const kat = S.kategorier.find(x => x.id === katId);
      logFør(tekst + ' · ' + (kat ? kat.navn : '') + (billede ? ' (kvittering)' : ''), belob, 'koeb');
      fjern(); tegn();     // fjern() kalder luk-handleren, som tager den næste i køen
      toast(kr(belob) + ' bogført under ' + (kat ? kat.navn : 'udgifter'));
    }});
}

/** Vælger man flere kvitteringer, bogføres de én efter én. */
let kvitteringKoe = [], kvitteringIalt = 0, kvitteringNr = 0;

function kvitteringValgt(filer){
  const liste = (filer || []).filter(f => f && /^image\//.test(f.type));
  if (!liste.length) return toast('Vælg et billede');
  kvitteringKoe = liste;
  kvitteringIalt = liste.length;
  kvitteringNr = 0;
  naesteKvittering();
}

async function naesteKvittering(){
  if (!kvitteringKoe.length) return;
  const fil = kvitteringKoe.shift();
  kvitteringNr += 1;
  const nr = kvitteringNr, ialt = kvitteringIalt;
  toast(ialt > 1 ? 'Behandler billede ' + nr + ' af ' + ialt : 'Behandler billedet…');
  try {
    const billede = await skalerBillede(fil, 1100);
    const gaet = await laesKvittering(billede.element);
    udgiftSheet({billede: billede, gaet: gaet, nr: nr, ialt: ialt, tilbage: kvitteringKoe.length});
  } catch(e){
    toast(e.message || 'Billedet kunne ikke bruges');
    naesteKvittering();
  }
}

/** Hvem betalte, og hvordan deles den? */
function udgiftValg(id){
  const u = S.udgifter.find(x => x.id === id);
  if (!u) return;
  const muligheder = erPar() ? [].concat(
    S.personer.map(p => ({k:'betaler:'+p.id, ic:'wallet', navn:esc(p.navn)+' betalte', txt:'Beløbet er lagt ud af '+esc(p.navn), valgt: u.betaler === p.id})),
    [{k:'deling:lige', ic:'users', navn:'Deles 50/50', txt:'I deler den lige over', valgt: u.deling === 'lige'},
     {k:'deling:mig',  ic:'wallet', navn:'Kun '+esc(personNavn(u.betaler)), txt:'Den anden skal ikke være med til at betale', valgt: u.deling === 'mig'}],
    S.personer.filter(p => p.id !== u.betaler).map(p => ({k:'deling:'+p.id, ic:'wallet', navn:esc(p.navn)+' betaler det hele', txt:'Selvom '+esc(personNavn(u.betaler))+' lagde ud', valgt: u.deling === p.id}))
  ) : [];

  const html = (u.kvittering ? '<div id="kvit-vis" style="margin-bottom:14px"></div>' : '')
    + '<div class="sheet-liste">'
    + muligheder.map(o => '<button class="sheet-valg" data-udgiftvalg="'+o.k+'" aria-pressed="'+o.valgt+'">'
        + '<span class="sv-ic">'+icon(o.ic,18)+'</span>'
        + '<span class="sv-t"><b>'+o.navn+'</b><span>'+o.txt+'</span></span>'
        + (o.valgt ? '<span class="sv-p">'+icon('check',17)+'</span>' : '') + '</button>').join('')
    + '<button class="sheet-valg" data-sletudgift="1"><span class="sv-ic">'+icon('trash',18)+'</span>'
    +   '<span class="sv-t"><b>Slet udgiften</b><span>Fjernes fra budgettet igen</span></span></button>'
    + '</div>';

  const sh2 = visSheet({titel:u.tekst, under:kr(u.belob) + (u.butik ? ' · ' + u.butik : ''), html, ved:(e, fjern) => {
    if (e.target.closest('[data-sletudgift]')){
      fjern();
      if (u.vare){
        const linje = S.liste.find(i => i.vare === u.vare);
        if (linje && linje.status === 'koebt') return saetStatus(u.vare, 'skal'), tegn(), toast('Udgiften og afkrydsningen er fjernet');
      }
      if (u.kvittering) Billeder.slet(u.kvittering).catch(() => {});
      S.udgifter = S.udgifter.filter(x => x.id !== id);
      tegn(); return toast('Udgiften er slettet');
    }
    const b = e.target.closest('[data-udgiftvalg]');
    if (!b) return;
    const [felt, vaerdi] = b.dataset.udgiftvalg.split(':');
    if (felt === 'betaler') u.betaler = vaerdi; else u.deling = vaerdi;
    fjern(); tegn(); gem();
    toast('Gemt');
  }});

  if (u.kvittering){
    Billeder.hent(u.kvittering).then(data => {
      const n = sh2.node.querySelector('#kvit-vis');
      if (!n) return;
      n.innerHTML = data
        ? '<img src="'+data+'" alt="Kvittering" style="width:100%;max-height:40vh;object-fit:contain;border-radius:14px;background:var(--surface-2)">'
        : '<div class="stat-s">Billedet ligger på den telefon, det blev taget med.</div>';
    }).catch(() => {});
  }
}

/** Ret hvor mange pakker der skal købes. */
function retAntal_sheet(vare){
  const linje = S.liste.find(i => i.vare === vare);
  const v = CATALOG[vare];
  const foreslaaet = pakker(vare, (linje.gange || (linje.retter || []).length) || 1);
  const html = felt('Antal pakker', 'f-antal', linje.antal || 1, 'number')
    + '<div class="stat-s" style="margin:-4px 0 14px">Én pakke er '+esc(v.enhed)+' og koster '+kr(pris(vare))
    + '. Madplanen foreslår '+foreslaaet+'.</div>'
    + '<div class="acts"><button class="btn btn-brand" data-ok="1" style="min-height:52px">Gem</button>'
    + (linje.egetAntal ? '<button class="btn" data-nulstilantal="1" style="min-height:52px">Følg madplanen igen</button>' : '')
    + '<button class="btn" data-luk="1" style="min-height:52px">Annullér</button></div>';

  visSheet({titel:v.navn, under:'Hvor meget skal I have med hjem?', html, ved:(e, fjern) => {
    if (e.target.closest('[data-nulstilantal]')){
      fjern(); linje.antal = foreslaaet; linje.egetAntal = false;
      opdaterKoebtBeloeb(vare); tegn(); return toast('Følger madplanen igen');
    }
    if (!e.target.closest('[data-ok]')) return;
    const n = Math.max(1, Math.round(Number(e.target.closest('.sheet').querySelector('#f-antal').value) || 1));
    fjern();
    linje.antal = n; linje.egetAntal = n !== foreslaaet;
    opdaterKoebtBeloeb(vare);
    tegn();
    toast(v.navn + ': ' + maengdeTekst(vare, n));
  }});
}
/** Er varen allerede krydset af, skal udgiften følge det nye antal. */
function opdaterKoebtBeloeb(vare){
  const linje = S.liste.find(i => i.vare === vare);
  if (linje && linje.status === 'koebt'){
    saetStatus(vare, 'skal', true);
    saetStatus(vare, 'koebt', true);
  }
}

/** Ret prisen på en råvare — fx hvis mælk koster 12 og ikke 11. */
function retPris_sheet(vare){
  const v = CATALOG[vare], bp = bedstePris(vare);
  const butikspris = (function(){
    const m = (v.tilbud || []).filter(t => S.butikker[t.b]);
    return m.length ? m.reduce((a,c) => c.p < a.p ? c : a).p : v.normal;
  })();
  const html = felt('Hvad koster den? (kr.)', 'f-pris', bp.pris, 'number')
    + '<div class="stat-s" style="margin:-4px 0 14px">Butikspris nu: '+kr(butikspris)+' · normalpris '+kr(v.normal)+'</div>'
    + '<div class="acts"><button class="btn btn-brand" data-ok="1" style="min-height:52px">Gem prisen</button>'
    + (bp.egen ? '<button class="btn" data-nulstilpris="1" style="min-height:52px">Brug butikkens pris igen</button>' : '')
    + '<button class="btn" data-luk="1" style="min-height:52px">Annullér</button></div>';

  visSheet({titel:v.navn, under:v.enhed + (bp.butik ? ' · billigst i ' + bp.butik : ''), html, ved:(e, fjern) => {
    if (e.target.closest('[data-nulstilpris]')){
      fjern(); delete S.priser[vare]; tegn(); return toast('Bruger butikkens pris igen');
    }
    if (!e.target.closest('[data-ok]')) return;
    const ny = Number(e.target.closest('.sheet').querySelector('#f-pris').value);
    fjern();
    if (!isFinite(ny) || ny < 0) return toast('Skriv et beløb');
    S.priser[vare] = Math.round(ny * 100) / 100;
    // Er varen allerede bogført, rettes udgiften med, så budgettet passer.
    const linje = S.liste.find(i => i.vare === vare);
    if (linje && linje.status === 'koebt'){
      saetStatus(vare, 'skal', true);
      saetStatus(vare, 'koebt', true);
    }
    logFør(v.navn + ' koster nu ' + kr(S.priser[vare]), 0, 'fri');
    tegn();
    toast(v.navn + ' sat til ' + kr(S.priser[vare]));
  }});
}

/* ============================================================
   Deling: skuffer
   ============================================================ */
function skySheet(titel, under, felter, knap, naar){
  const html = felter + knapRaekke(knap);
  const sh = visSheet({titel, under, html, ved: async (e, fjern) => {
    if (!e.target.closest('[data-ok]')) return;
    const knapEl = e.target.closest('[data-ok]');
    const vaerdier = {};
    sh.node.querySelectorAll('input').forEach(i => { vaerdier[i.id.replace('f-','')] = i.value.trim(); });
    knapEl.disabled = true; knapEl.textContent = 'Et øjeblik…';
    try {
      await naar(vaerdier);
      fjern();
    } catch(err){
      knapEl.disabled = false; knapEl.textContent = knap;
      toast(err.message || 'Det gik ikke', 'fejl');
    }
  }});

/** Kopiér tekst — med en reserveløsning til browsere uden clipboard-adgang. */
async function kopier(tekst){
  try {
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(tekst);
      return true;
    }
  } catch(e){ /* falder igennem */ }
  try {
    const t = document.createElement('textarea');
    t.value = tekst;
    t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t);
    t.focus(); t.select();
    const ok = document.execCommand('copy');
    t.remove();
    return ok;
  } catch(e){ return false; }
}

/* ---------------- klik ---------------- */
document.addEventListener('click', (e) => {
  if (!e.target || !e.target.closest) return;
  if (e.target.closest('.scrim')) return;                    // skuffen har sin egen håndtering

  const t = e.target.closest('[data-fane],[data-gaatil],[data-vare],[data-valg],[data-alle],[data-lavet],[data-fortryd],'
    + '[data-byt],[data-vaelg],[data-ude],[data-tilbagepaa],[data-aabn],[data-gen],[data-butik],[data-ryd],[data-nulstil],'
    + '[data-kost],[data-sort],[data-ret],[data-skiftmaal],[data-laegtil],[data-flytsparet],[data-redigerindkomst],'
    + '[data-nykat],[data-retkat],[data-sletkat],[data-nyfast],[data-retfast],[data-sletfast],'
    + '[data-nymaal],[data-retmaal],[data-sletmaal],[data-vaelgmaal],[data-saetkost],[data-tilfoej],[data-flere],[data-opskrift],[data-flytforbrug],[data-udgift],[data-afregn],[data-nyudgift],[data-retantal],[data-skyopsaet],[data-skylogin],[data-skytjek],[data-skema],[data-skyglem],[data-skyudlog],[data-nyhusstand],[data-tilslut],[data-forlad],[data-mitnavn],[data-deldefault]');

  if (!t){
    // Tryk hvor som helst på en varelinje eller en dag
    const linje = e.target.closest('.item');
    if (linje && !e.target.closest('label.cb')){
      const cb = linje.querySelector('input[data-vare]');
      if (cb){ cb.checked = !cb.checked; cb.dispatchEvent(new Event('change', {bubbles:true})); }
      return;
    }
    const dagTop = e.target.closest('.day-top');
    if (dagTop){
      const d = dagTop.closest('.day');
      d.classList.toggle('open');
      const pil = d.querySelector('[data-aabn]');
      if (pil) pil.style.transform = d.classList.contains('open') ? 'rotate(180deg)' : '';
    }
    return;
  }
  const d = t.dataset;

  if (d.fane) return skiftFane(d.fane);
  if (d.gaatil) return skiftFane(d.gaatil);

  if (d.aabn){
    const dag = t.closest('.day');
    dag.classList.toggle('open');
    t.style.transform = dag.classList.contains('open') ? 'rotate(180deg)' : '';
    return;
  }

  /* --- indkøb --- */
  if (d.valg) return linjeValg(d.valg);
  if (d.alle){
    const varer = skalKoebes().map(i => i.vare);
    if (!varer.length) return;
    const sum = varer.reduce((s,v) => s + pris(v), 0);
    varer.forEach(v => saetStatus(v, 'koebt', true));
    logFør(varer.length + ' varer købt', sum, 'koeb');
    bump(12); tegn();
    return toast(varer.length+' varer bogført · '+kr(sum), () => {
      varer.forEach(v => saetStatus(v, 'skal', true));
      S.log = S.log.filter(l => l.tekst !== varer.length + ' varer købt');
    });
  }

  /* --- madplan --- */
  if (d.lavet){
    bump(14);
    const dato = d.lavet, r = lavRet(dato);
    tegn();
    if (r) toast(r.manglede.length
      ? r.ret+' ✓ · '+r.manglede.length+' manglende vare'+(r.manglede.length>1?'r':'')+' bogført ('+kr(r.ekstra)+')'
      : r.ret+' ✓ · varerne er brugt fra spisekammeret',
      () => { fortrydRet(dato); r.manglede.forEach(v => saetStatus(v, 'skal', true)); });
    return;
  }
  if (d.fortryd){ fortrydRet(d.fortryd); return tegn(); }
  if (d.byt){ byttRet(d.byt); tegn(); return toast('Byttet til en anden ret'); }
  if (d.vaelg) return vaelgRetTilDag(d.vaelg);
  if (d.ude){
    const dato = d.ude;
    udeAtSpise(dato); tegn();
    return toast(dagNavn(dato)+': ude at spise', () => {
      const dag = S.plan.find(x => x.dato === dato);
      if (dag){ dag.status = 'planlagt'; synkroniserListe(); }
    });
  }
  if (d.tilbagepaa) return vaelgRetTilDag(d.tilbagepaa);
  if (d.ret) return visOpskrift(d.ret);
  if (d.opskrift) return visOpskrift(d.opskrift, {dag: t.dataset.dag || null});
  if (d.sort){ retSort = d.sort; retVis = 40; return tegn(); }
  if (d.flere){ retVis += 40; return tegn(); }
  if (d.tilfoej){
    const k = d.tilfoej;
    if (S.liste.some(i => i.vare === k)) return toast(CATALOG[k].navn + ' er allerede på listen');
    S.liste.push({vare:k, retter:[], status:'skal', manuel:true});
    S.liste = sorterListe(S.liste);
    logFør(CATALOG[k].navn + ' lagt på indkøbslisten', 0, 'fri');
    bump(8); tegn();
    return toast(CATALOG[k].navn + ' lagt på listen', () => { S.liste = S.liste.filter(i => i.vare !== k); });
  }
  if (d.kost) return vaelgKost();
  if (d.saetkost){
    if (S.kost !== d.saetkost){ S.kost = d.saetkost; synkroniserListe(); }
    return tegn();
  }

  if (d.gen){
    S.plan = nyMadplan();
    synkroniserListe();
    logFør('Nyt ugeforslag · '+kr(planSum()), 0, 'plan');
    if (visning === 'retter') skiftFane('madplan'); else tegn();
    return toast('Ugeforslag lavet — ret det til som du vil');
  }

  if (d.butik){
    S.butikker[d.butik] = !S.butikker[d.butik];
    return tegn();
  }
  if (d.ryd){ S.log = []; return tegn(); }

  /* --- opsparing --- */
  if (d.skiftmaal || d.vaelgmaal){
    if (d.vaelgmaal && !e.target.closest('[data-retmaal],[data-sletmaal]')){
      S.aktivOpsparing = d.vaelgmaal; tegn(); return toast('Følger nu '+aktivMaal().navn);
    }
    if (d.skiftmaal){
      const html = '<div class="sheet-liste">'
        + S.opsparinger.map(o => '<button class="sheet-valg" data-maalvalg="'+o.id+'" aria-pressed="'+(o.id===S.aktivOpsparing)+'">'
            + '<span class="sv-ic">'+icon('pig',18)+'</span>'
            + '<span class="sv-t"><b>'+esc(o.navn)+'</b><span>'+kr(o.sparet)+' af '+kr(o.maal)+'</span></span></button>').join('')
        + '</div>';
      return visSheet({titel:'Hvad sparer I op til?', html, ved:(ev, fjern) => {
        const b = ev.target.closest('[data-maalvalg]');
        if (!b) return;
        S.aktivOpsparing = b.dataset.maalvalg; fjern(); tegn();
      }});
    }
  }
  if (d.laegtil){
    const o = S.opsparinger.find(x => x.id === d.laegtil);
    return visSheet({titel:'Læg til '+o.navn, html: felt('Beløb (kr.)','f-belob',500,'number') + knapRaekke('Læg til'),
      ved:(ev, fjern) => {
        if (!ev.target.closest('[data-ok]')) return;
        const v = Math.round(Number(ev.target.closest('.sheet').querySelector('#f-belob').value) || 0);
        fjern();
        if (v <= 0) return;
        o.sparet += v;
        logFør(kr(v)+' lagt til '+o.navn, 0, 'opsparing');
        tegn(); toast(kr(v)+' lagt til '+o.navn);
      }});
  }
  if (d.flytforbrug) return flytForbrug(d.flytforbrug);
  if (d.nyudgift) return udgiftSheet({});
  if (d.udgift) return udgiftValg(d.udgift);
  if (d.afregn){
    const min = saldo(migsId()), anden = denAnden();
    if (!anden || Math.abs(min) < 1) return;
    const skyldner = min > 0 ? anden : S.personer.find(p => p.id === migsId());
    const modtager = min > 0 ? S.personer.find(p => p.id === migsId()) : anden;
    return bekraeft('Afregn ' + kr(Math.abs(min)) + '?',
      esc(skyldner.navn) + ' betaler ' + kr(Math.abs(min)) + ' til ' + esc(modtager.navn) + ', og så er I kvit.',
      'Afregnet', () => {
        S.afregninger.push({id:uid(), fra:skyldner.id, til:modtager.id, belob:Math.abs(min), dato:ymd(new Date())});
        logFør(esc(skyldner.navn)+' afregnede '+kr(Math.abs(min))+' til '+esc(modtager.navn), 0, 'opsparing');
        tegn(); toast('I er kvit');
      });
  }
  if (d.skema) return skemaSheet();
  if (d.skytjek) return skyTjek();
  if (d.skyopsaet) return skyOpsaetning();
  if (d.skylogin) return skyLogin();
  if (d.skyglem) return bekraeft('Skift projekt?', 'Appen glemmer Supabase-opsætningen på denne telefon. Dine data bliver liggende.', 'Glem', () => { Sky.glemOpsætning(); Sky.logUd(); tegn(); });
  if (d.skyudlog) return bekraeft('Log ud?', 'Dine data bliver liggende på denne telefon.', 'Log ud', () => { Sky.logUd(); saetSkyStatus('lokal'); tegn(); });
  if (d.nyhusstand) return nyHusstand();
  if (d.tilslut) return tilslutHusstand();
  if (d.forlad) return bekraeft('Forlad husstanden?', 'Du deler ikke længere med din partner. Data bliver liggende hos jer begge.', 'Forlad', async () => {
    try { await Sky.forlad(); } catch(e){}
    S.personer = [{id: migsId(), navn: S.personer.find(p => p.id === migsId()) ? personNavn(migsId()) : 'Mig'}];
    saetSkyStatus('lokal'); tegn(); toast('Du har forladt husstanden');
  }, true);
  if (d.mitnavn){
    const nu = personNavn(migsId());
    return skySheet('Dit navn', 'Sådan står du hos din partner.', felt('Fornavn', 'f-navn', nu), 'Gem', async (v) => {
      if (!v.navn) return;
      const p = S.personer.find(x => x.id === migsId());
      if (p) p.navn = v.navn;
      if (typeof Sky !== 'undefined' && Sky.harHusstand()) await Sky.saetMitNavn(v.navn);
      tegn(); toast('Gemt');
    });
  }
  if (d.deldefault){ S.delDefault = d.deldefault; tegn(); return; }
  if (d.flytsparet){
    const o = S.opsparinger.find(x => x.id === d.flytsparet);
    const beloeb = Math.round(S.sparetIalt);
    return bekraeft('Flyt det sparede?', 'Læg de '+kr(beloeb)+' du har sparet på tilbud over i '+o.navn+'.', 'Flyt '+kr(beloeb), () => {
      o.sparet += beloeb;
      logFør(kr(beloeb)+' sparet på tilbud flyttet til '+o.navn, 0, 'opsparing');
      tegn(); toast('Flyttet til '+o.navn);
    });
  }

  /* --- indstillinger: indkomst, kategorier, faste, mål --- */
  if (d.redigerindkomst){
    return visSheet({titel:'Månedlig indkomst', html: felt('Udbetalt pr. måned (kr.)','f-belob',S.indkomst,'number') + knapRaekke('Gem'),
      ved:(ev, fjern) => {
        if (!ev.target.closest('[data-ok]')) return;
        const v = Math.max(0, Math.round(Number(ev.target.closest('.sheet').querySelector('#f-belob').value) || 0));
        fjern(); S.indkomst = v; tegn(); toast('Indkomst gemt');
      }});
  }
  if (d.nykat) return redigerPost({titel:'Ny kategori', navn:'', belob:1000, ic:'basket', gem:(r) => {
    S.kategorier.push({id:uid(), navn:r.navn, graense:r.belob, ic:r.ic});
    tegn(); toast(r.navn+' tilføjet');
  }});
  if (d.retkat){
    const k = S.kategorier.find(x => x.id === d.retkat);
    return redigerPost({titel:'Ret '+k.navn, navn:k.navn, belob:k.graense, ic:k.ic, gem:(r) => {
      k.navn = r.navn; k.graense = r.belob; k.ic = r.ic; tegn(); toast('Gemt');
    }});
  }
  if (d.sletkat){
    const k = S.kategorier.find(x => x.id === d.sletkat);
    return bekraeft('Slet '+k.navn+'?', 'Udgifter i kategorien flyttes til den første kategori.', 'Slet', () => {
      const rest = S.kategorier.filter(x => x.id !== k.id);
      if (!rest.length) return toast('Du skal have mindst én kategori');
      if (k.dagligvare && rest.length) rest[0].dagligvare = true;
      S.udgifter.forEach(u => { if (u.kategori === k.id) u.kategori = rest[0].id; });
      S.kategorier = rest;
      tegn(); toast(k.navn+' slettet');
    }, true);
  }
  if (d.nyfast) return redigerPost({titel:'Ny fast udgift', navn:'', belob:0, ic:'house', gem:(r) => {
    S.faste.push({id:uid(), navn:r.navn, belob:r.belob, ic:r.ic});
    tegn(); toast(r.navn+' tilføjet');
  }});
  if (d.retfast){
    const f = S.faste.find(x => x.id === d.retfast);
    return redigerPost({titel:'Ret '+f.navn, navn:f.navn, belob:f.belob, ic:f.ic, gem:(r) => {
      f.navn = r.navn; f.belob = r.belob; f.ic = r.ic; tegn(); toast('Gemt');
    }});
  }
  if (d.sletfast){
    const f = S.faste.find(x => x.id === d.sletfast);
    return bekraeft('Slet '+f.navn+'?', 'Den fjernes fra dine faste udgifter.', 'Slet', () => {
      S.faste = S.faste.filter(x => x.id !== f.id); tegn(); toast(f.navn+' slettet');
    }, true);
  }
  if (d.nymaal) return redigerPost({titel:'Nyt opsparingsmål', navn:'', belob:10000, sparet:0, felter:'maal', gem:(r) => {
    const o = {id:uid(), navn:r.navn, maal:r.belob, sparet:r.sparet};
    S.opsparinger.push(o);
    if (!S.aktivOpsparing) S.aktivOpsparing = o.id;
    tegn(); toast(r.navn+' tilføjet');
  }});
  if (d.retmaal){
    const o = S.opsparinger.find(x => x.id === d.retmaal);
    return redigerPost({titel:'Ret '+o.navn, navn:o.navn, belob:o.maal, sparet:o.sparet, felter:'maal', gem:(r) => {
      o.navn = r.navn; o.maal = r.belob; o.sparet = r.sparet; tegn(); toast('Gemt');
    }});
  }
  if (d.sletmaal){
    const o = S.opsparinger.find(x => x.id === d.sletmaal);
    return bekraeft('Slet '+o.navn+'?', 'Målet fjernes. "Sparet i alt" på forsiden bliver stående.', 'Slet', () => {
      S.opsparinger = S.opsparinger.filter(x => x.id !== o.id);
      if (S.aktivOpsparing === o.id) S.aktivOpsparing = S.opsparinger.length ? S.opsparinger[0].id : null;
      tegn(); toast(o.navn+' slettet');
    }, true);
  }

  if (d.nulstil){
    return bekraeft('Nulstil alt?', 'Madplan, indkøbsliste, udgifter og opsætning sættes tilbage til start.', 'Nulstil', () => {
      S = friskState(); visning = 'hjem'; tegn(); toast('Nulstillet');
    }, true);
  }
});

/* ---------------- ændringer ---------------- */
document.addEventListener('change', (e) => {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.vare){
    const v = el.dataset.vare;
    const linje = S.liste.find(i => i.vare === v);
    const foer = linje ? linje.status : 'skal';
    saetStatus(v, el.checked ? 'koebt' : 'skal');
    bump(10); tegn();
    if (el.checked) toast(CATALOG[v].navn+' · '+kr(pris(v))+' trukket fra '+dagligvareKat().navn.toLowerCase(),
      () => saetStatus(v, foer, true));
    return;
  }
  if (el.dataset.auto){ S.auto[el.dataset.auto] = el.checked; gem(); }
});

document.addEventListener('change', (e) => {
  if (e.target && (e.target.id === 'kvit-kamera' || e.target.id === 'kvit-galleri')){
    const kopi = e.target.files ? Array.prototype.slice.call(e.target.files) : [];
    e.target.value = '';        // så samme billede kan vælges igen
    kvitteringValgt(kopi);
  }
});

document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'retsoeg'){ retSoeg = e.target.value; retVis = 40; tegn(); }
});

/* ---------------- stryg mellem faner ---------------- */
(function(){
  let x0 = null, y0 = null, t0 = 0;
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const m = e.target;
    if (m && m.closest && (m.closest('.scrim') || m.closest('input'))) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, {passive:true});
  document.addEventListener('touchend', (e) => {
    if (x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Date.now() - t0 > 600 || Math.abs(dx) < 65 || Math.abs(dy) > 45) return;
    if (visning === 'indstillinger') return;
    const r = FANER.map(f => f.key), i = r.indexOf(visning);
    const n = dx < 0 ? i + 1 : i - 1;
    if (n < 0 || n >= r.length) return;
    bump(6); skiftFane(r[n]);
  }, {passive:true});
})();

/* ---------------- start ---------------- */
S = hent() || friskState();
if (!S.plan.length){ S.plan = nyMadplan(); synkroniserListe(); }
tegn();

if (typeof Sky !== 'undefined' && Sky.opsat() && Sky.loggetInd()){
  startSky().then(opdaterMedlemmer);
}
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
